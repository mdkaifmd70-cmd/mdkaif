<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Image Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#1f2937;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.header{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:25px;
}

.header p{
    margin-top:5px;
    color:#6b7280;
    font-size:14px;
}

.logout{
    background:#dc2626;
    color:#fff;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

select,
input[type="text"],
input[type="url"],
input[type="file"]{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:#fff;
    font-size:14px;
}

select:focus,
input:focus{
    outline:none;
    border-color:#2563eb;
}

.btn{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-success{
    background:#16a34a;
    color:#fff;
}

.btn-secondary{
    background:#6b7280;
    color:#fff;
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-warning{
    background:#d97706;
    color:#fff;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.actions{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.hidden{
    display:none !important;
}

.preview-box{
    margin-top:15px;
    width:180px;
    height:180px;
    border:2px dashed #d1d5db;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f9fafb;
}

.preview-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.preview-placeholder{
    color:#9ca3af;
    font-size:13px;
    text-align:center;
    padding:10px;
}

.progress-wrap{
    margin-top:15px;
    background:#e5e7eb;
    height:8px;
    border-radius:10px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.2s;
}

.status{
    margin-top:12px;
    font-size:14px;
    font-weight:600;
}

.status.success{
    color:#15803d;
}

.status.error{
    color:#dc2626;
}

.status.info{
    color:#2563eb;
}

.images-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    gap:10px;
}

.images-header h2{
    font-size:20px;
}

.image-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}

.image-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
}

.image-card-image{
    width:100%;
    height:210px;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.image-card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.image-info{
    padding:14px;
}

.image-info h3{
    font-size:15px;
    margin-bottom:7px;
}

.image-info p{
    color:#6b7280;
    font-size:13px;
    margin-bottom:5px;
    word-break:break-word;
}

.card-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.card-actions button{
    flex:1;
    padding:8px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.empty{
    padding:40px 20px;
    text-align:center;
    color:#6b7280;
    border:2px dashed #e5e7eb;
    border-radius:12px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

@media(max-width:700px){
    .row{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .image-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Product Image Manager</h1>
            <p>Upload and manage product images</p>
        </div>

        <button class="logout" id="logoutBtn">
            Logout
        </button>
    </div>


    <!-- PRODUCT SELECT -->
    <div class="card">

        <label for="productSelect">
            Select Product
        </label>

        <select id="productSelect">
            <option value="">Loading products...</option>
        </select>

        <div class="actions">
            <button
                type="button"
                class="btn btn-primary"
                id="addImageBtn">
                + Add Image
            </button>
        </div>

    </div>


    <!-- ADD / EDIT IMAGE -->
    <div class="card hidden" id="imageFormCard">

        <h2 id="formTitle">
            Add Product Image
        </h2>

        <br>

        <div class="row">

            <div>

                <label for="imageFile">
                    Choose Image *
                </label>

                <input
                    type="file"
                    id="imageFile"
                    accept="image/jpeg,image/png,image/webp,image/gif">

                <small style="display:block;margin-top:7px;color:#6b7280;">
                    JPG, PNG, WEBP or GIF
                </small>

            </div>


            <div>

                <label for="altText">
                    Alt Text
                </label>

                <input
                    type="text"
                    id="altText"
                    placeholder="Product image description">

            </div>

        </div>


        <!-- PREVIEW -->
        <div class="preview-box" id="previewBox">

            <div class="preview-placeholder" id="previewPlaceholder">
                Image preview will appear here
            </div>

            <img
                id="imagePreview"
                class="hidden"
                alt="Preview">

        </div>


        <div
            class="progress-wrap hidden"
            id="progressWrap">

            <div
                class="progress"
                id="progressBar">
            </div>

        </div>


        <div
            class="status"
            id="uploadStatus">
        </div>


        <div class="actions">

            <button
                type="button"
                class="btn btn-success"
                id="saveImageBtn">

                Upload & Save

            </button>

            <button
                type="button"
                class="btn btn-secondary"
                id="cancelBtn">

                Cancel

            </button>

        </div>

    </div>


    <!-- IMAGES -->
    <div class="card">

        <div class="images-header">

            <h2>
                Product Images
            </h2>

            <span
                id="imageCount"
                style="color:#6b7280;font-size:14px;">
                0 Images
            </span>

        </div>

        <div id="imagesContainer">

            <div class="empty">
                Select a product to view images.
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const STORAGE_BUCKET =
    "product-images";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentClientId = null;

let products = [];

let editingImageId = null;
let editingImageUrl = null;


/* ================================
   DOM
================================ */

const productSelect =
    document.getElementById("productSelect");

const addImageBtn =
    document.getElementById("addImageBtn");

const imageFormCard =
    document.getElementById("imageFormCard");

const imageFile =
    document.getElementById("imageFile");

const imagePreview =
    document.getElementById("imagePreview");

const previewPlaceholder =
    document.getElementById("previewPlaceholder");

const altText =
    document.getElementById("altText");

const saveImageBtn =
    document.getElementById("saveImageBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const imagesContainer =
    document.getElementById("imagesContainer");

const imageCount =
    document.getElementById("imageCount");

const uploadStatus =
    document.getElementById("uploadStatus");

const progressWrap =
    document.getElementById("progressWrap");

const progressBar =
    document.getElementById("progressBar");

const formTitle =
    document.getElementById("formTitle");

const logoutBtn =
    document.getElementById("logoutBtn");


/* ================================
   INITIALIZE
================================ */

async function initialize(){

    try{

        const {
            data: { user },
            error
        } =
        await supabaseClient.auth.getUser();


        if(error){
            throw error;
        }


        if(!user){

            window.location.href =
                "admin.html";

            return;
        }


        currentUser = user;


        /* GET PROFILE */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
        .from("profiles")
        .select("id,role,client_id")
        .eq("id", user.id)
        .single();


        if(profileError){

            console.error(profileError);

            showStatus(
                "Unable to load user profile.",
                "error"
            );

            return;
        }


        currentClientId =
            profile.client_id;


        if(!currentClientId){

            showStatus(
                "Your user is not assigned to a client yet.",
                "error"
            );

            productSelect.innerHTML =
                `<option value="">
                    No client assigned
                </option>`;

            return;
        }


        await loadProducts();

    }
    catch(error){

        console.error(error);

        showStatus(
            error.message || "Initialization failed.",
            "error"
        );

    }

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    productSelect.innerHTML =
        `<option value="">
            Loading products...
        </option>`;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("products")
    .select("id,name,product_code")
    .eq("client_id", currentClientId)
    .order("name",{ascending:true});


    if(error){

        console.error(error);

        productSelect.innerHTML =
            `<option value="">
                Error loading products
            </option>`;

        showStatus(
            "Unable to load products: " + error.message,
            "error"
        );

        return;
    }


    products = data || [];


    productSelect.innerHTML =
        `<option value="">
            -- Select Product --
        </option>`;


    products.forEach(product => {

        const option =
            document.createElement("option");

        option.value =
            product.id;

        option.textContent =
            product.product_code
            ? `${product.name} (${product.product_code})`
            : product.name;

        productSelect.appendChild(option);

    });

}


/* ================================
   PRODUCT CHANGE
================================ */

productSelect.addEventListener(
    "change",
    async function(){

        closeForm();

        if(!this.value){

            imagesContainer.innerHTML =
                `<div class="empty">
                    Select a product to view images.
                </div>`;

            imageCount.textContent =
                "0 Images";

            return;
        }


        await loadImages(this.value);

    }
);


/* ================================
   LOAD IMAGES
================================ */

async function loadImages(productId){

    imagesContainer.innerHTML =
        `<div class="loading">
            Loading images...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("product_images")
    .select("*")
    .eq("client_id", currentClientId)
    .eq("product_id", productId)
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        imagesContainer.innerHTML =
            `<div class="empty">
                Unable to load images.<br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    const images =
        data || [];


    imageCount.textContent =
        `${images.length} Image${images.length === 1 ? "" : "s"}`;


    if(images.length === 0){

        imagesContainer.innerHTML =
            `<div class="empty">
                No images found for this product.<br><br>
                Click <b>+ Add Image</b> to upload the first image.
            </div>`;

        return;
    }


    const grid =
        document.createElement("div");

    grid.className =
        "image-grid";


    images.forEach(image => {

        const card =
            document.createElement("div");

        card.className =
            "image-card";


        card.innerHTML = `

            <div class="image-card-image">

                <img
                    src="${escapeAttribute(image.image_url)}"
                    alt="${escapeAttribute(image.alt_text || "Product Image")}"
                    loading="lazy"
                    onerror="this.style.display='none';">

            </div>

            <div class="image-info">

                <h3>
                    ${escapeHtml(image.alt_text || "Product Image")}
                </h3>

                <p>
                    Sort Order:
                    ${image.sort_order ?? 0}
                </p>

                <p>
                    ${escapeHtml(image.image_url)}
                </p>

                <div class="card-actions">

                    <button
                        class="btn-warning"
                        onclick="editImage('${image.id}')">

                        Edit

                    </button>

                    <button
                        class="btn-danger"
                        onclick="deleteImage('${image.id}','${escapeAttribute(image.image_url)}')">

                        Delete

                    </button>

                </div>

            </div>

        `;


        grid.appendChild(card);

    });


    imagesContainer.innerHTML = "";

    imagesContainer.appendChild(grid);

}


/* ================================
   ADD IMAGE
================================ */

addImageBtn.addEventListener(
    "click",
    function(){

        if(!productSelect.value){

            alert("Please select a product first.");

            return;
        }


        editingImageId = null;
        editingImageUrl = null;

        formTitle.textContent =
            "Add Product Image";

        saveImageBtn.textContent =
            "Upload & Save";

        imageFile.value = "";

        altText.value = "";

        resetPreview();

        clearStatus();

        imageFormCard.classList.remove("hidden");

        imageFormCard.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }
);


/* ================================
   IMAGE PREVIEW
================================ */

imageFile.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            resetPreview();

            return;
        }


        if(!file.type.startsWith("image/")){

            alert("Please select a valid image file.");

            this.value = "";

            resetPreview();

            return;
        }


        const maxSize =
            10 * 1024 * 1024;


        if(file.size > maxSize){

            alert("Image size must be less than 10 MB.");

            this.value = "";

            resetPreview();

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                imagePreview.src =
                    e.target.result;

                imagePreview.classList.remove(
                    "hidden"
                );

                previewPlaceholder.classList.add(
                    "hidden"
                );

            };


        reader.readAsDataURL(file);

    }
);


/* ================================
   SAVE IMAGE
================================ */

saveImageBtn.addEventListener(
    "click",
    async function(){

        if(!productSelect.value){

            alert("Please select a product first.");

            return;
        }


        const file =
            imageFile.files[0];


        /*
            ADD MODE
        */

        if(!editingImageId && !file){

            alert("Please choose an image.");

            return;
        }


        saveImageBtn.disabled = true;

        clearStatus();

        progressWrap.classList.remove(
            "hidden"
        );

        progressBar.style.width =
            "10%";


        try{

            let imageUrl =
                editingImageUrl;


            /*
                NEW IMAGE UPLOAD
            */

            if(file){

                showStatus(
                    "Uploading image...",
                    "info"
                );


                const extension =
                    file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const safeExtension =
                    extension || "jpg";


                const uniqueName =
                    `${crypto.randomUUID()}.${safeExtension}`;


                const storagePath =
                    `${currentClientId}/${productSelect.value}/${uniqueName}`;


                progressBar.style.width =
                    "30%";


                const {
                    error: uploadError
                } =
                await supabaseClient
                .storage
                .from(STORAGE_BUCKET)
                .upload(
                    storagePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );


                if(uploadError){

                    throw uploadError;
                }


                progressBar.style.width =
                    "70%";


                const {
                    data: publicData
                } =
                supabaseClient
                .storage
                .from(STORAGE_BUCKET)
                .getPublicUrl(storagePath);


                imageUrl =
                    publicData.publicUrl;


                if(!imageUrl){

                    throw new Error(
                        "Unable to generate public image URL."
                    );
                }

            }


            /*
                UPDATE
            */

            if(editingImageId){

                showStatus(
                    "Updating image...",
                    "info"
                );


                const {
                    error
                } =
                await supabaseClient
                .from("product_images")
                .update({

                    image_url: imageUrl,

                    alt_text:
                        altText.value.trim() || null

                })
                .eq("id", editingImageId)
                .eq("client_id", currentClientId)
                .eq("product_id", productSelect.value);


                if(error){

                    throw error;
                }


                progressBar.style.width =
                    "100%";


                showStatus(
                    "Image updated successfully.",
                    "success"
                );

            }

            /*
                INSERT
            */

            else{

                showStatus(
                    "Saving image information...",
                    "info"
                );


                const {
                    data: existingImages,
                    error: countError
                } =
                await supabaseClient
                .from("product_images")
                .select("sort_order")
                .eq("client_id", currentClientId)
                .eq("product_id", productSelect.value);


                if(countError){

                    throw countError;
                }


                let nextSortOrder = 0;


                if(existingImages && existingImages.length){

                    nextSortOrder =
                        Math.max(
                            ...existingImages.map(
                                x => Number(x.sort_order || 0)
                            )
                        ) + 1;

                }


                const {
                    error
                } =
                await supabaseClient
                .from("product_images")
                .insert({

                    product_id:
                        productSelect.value,

                    client_id:
                        currentClientId,

                    image_url:
                        imageUrl,

                    alt_text:
                        altText.value.trim() || null,

                    sort_order:
                        nextSortOrder

                });


                if(error){

                    throw error;
                }


                progressBar.style.width =
                    "100%";


                showStatus(
                    "Image uploaded and saved successfully.",
                    "success"
                );

            }


            await loadImages(
                productSelect.value
            );


            setTimeout(() => {

                closeForm();

            }, 900);


        }
        catch(error){

            console.error(error);

            showStatus(
                error.message ||
                "Image upload failed.",
                "error"
            );

        }
        finally{

            saveImageBtn.disabled =
                false;

        }

    }
);


/* ================================
   EDIT IMAGE
================================ */

window.editImage =
async function(imageId){

    if(!productSelect.value){

        alert("Please select a product.");

        return;
    }


    const {
        data: image,
        error
    } =
    await supabaseClient
    .from("product_images")
    .select("*")
    .eq("id", imageId)
    .eq("client_id", currentClientId)
    .eq("product_id", productSelect.value)
    .single();


    if(error){

        alert(
            "Unable to load image: " +
            error.message
        );

        return;
    }


    editingImageId =
        image.id;

    editingImageUrl =
        image.image_url;


    formTitle.textContent =
        "Edit Product Image";

    saveImageBtn.textContent =
        "Update Image";

    altText.value =
        image.alt_text || "";

    imageFile.value = "";


    imagePreview.src =
        image.image_url;

    imagePreview.classList.remove(
        "hidden"
    );

    previewPlaceholder.classList.add(
        "hidden"
    );


    clearStatus();

    imageFormCard.classList.remove(
        "hidden"
    );

    imageFormCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

};


/* ================================
   DELETE IMAGE
================================ */

window.deleteImage =
async function(imageId,imageUrl){

    if(!confirm(
        "Are you sure you want to delete this image?"
    )){

        return;
    }


    try{

        const {
            error
        } =
        await supabaseClient
        .from("product_images")
        .delete()
        .eq("id",imageId)
        .eq("client_id",currentClientId)
        .eq("product_id",productSelect.value);


        if(error){

            throw error;
        }


        /*
          Try to delete storage file also.
          This prevents unnecessary storage usage.
        */

        try{

            const storagePath =
                getStoragePathFromUrl(imageUrl);


            if(storagePath){

                await supabaseClient
                .storage
                .from(STORAGE_BUCKET)
                .remove([
                    storagePath
                ]);

            }

        }
        catch(storageError){

            console.warn(
                "Storage delete warning:",
                storageError
            );

        }


        await loadImages(
            productSelect.value
        );


        alert(
            "Image deleted successfully."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

    }

};


/* ================================
   STORAGE PATH FROM URL
================================ */

function getStoragePathFromUrl(url){

    if(!url){
        return null;
    }


    try{

        const marker =
            `/storage/v1/object/public/${STORAGE_BUCKET}/`;


        const index =
            url.indexOf(marker);


        if(index === -1){

            return null;
        }


        return decodeURIComponent(
            url.substring(
                index + marker.length
            )
        );

    }
    catch(error){

        return null;
    }

}


/* ================================
   CANCEL
================================ */

cancelBtn.addEventListener(
    "click",
    closeForm
);


function closeForm(){

    imageFormCard.classList.add(
        "hidden"
    );

    editingImageId = null;

    editingImageUrl = null;

    imageFile.value = "";

    altText.value = "";

    resetPreview();

    clearStatus();

}


/* ================================
   PREVIEW RESET
================================ */

function resetPreview(){

    imagePreview.src = "";

    imagePreview.classList.add(
        "hidden"
    );

    previewPlaceholder.classList.remove(
        "hidden"
    );

}


/* ================================
   STATUS
================================ */

function showStatus(
    message,
    type="info"
){

    uploadStatus.textContent =
        message;

    uploadStatus.className =
        "status " + type;

}


function clearStatus(){

    uploadStatus.textContent =
        "";

    uploadStatus.className =
        "status";

    progressWrap.classList.add(
        "hidden"
    );

    progressBar.style.width =
        "0%";

}


/* ================================
   LOGOUT
================================ */

logoutBtn.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        window.location.href =
            "admin.html";

    }
);


/* ================================
   SECURITY HELPERS
================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}

   START
================================ */

initialize();

</script>
