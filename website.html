<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Website...</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#f5f7fb;
}
.box{
    text-align:center;
    padding:30px;
}
</style>
</head>

<body>

<div class="box">
    <h2>Loading Website...</h2>
    <p id="status">Please wait...</p>
</div>

<script>

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function loadWebsite(){

    const status =
        document.getElementById("status");

    const params =
        new URLSearchParams(window.location.search);

    const clientId =
        params.get("client");

    if(!clientId){

        status.textContent =
            "Client ID missing.";

        return;
    }

    try{

        const { data: client, error } =
            await supabaseClient
                .from("clients")
                .select(`
                    id,
                    company_name,
                    slug,
                    template,
                    status
                `)
                .eq("id", clientId)
                .single();

        if(error){

            console.error(error);

            status.textContent =
                "Client not found.";

            return;
        }

        if(!client){

            status.textContent =
                "Client not found.";

            return;
        }

        if(
            client.status &&
            String(client.status).toLowerCase() !== "active"
        ){

            status.textContent =
                "This website is inactive.";

            return;
        }

        const templateSlug =
            String(client.template || "")
            .trim()
            .toLowerCase();

        if(!templateSlug){

            status.textContent =
                "No template assigned to this client.";

            return;
        }

        /*
         * IMPORTANT:
         * GitHub Pages repository = /mdkaif/
         */

        const basePath = "/mdkaif/";

        const templateUrl =
            basePath +
            "templates/" +
            encodeURIComponent(templateSlug) +
            "/index.html?client=" +
            encodeURIComponent(clientId);

        console.log("Template URL:", templateUrl);

        window.location.replace(templateUrl);

    }catch(err){

        console.error(err);

        status.textContent =
            "Unable to load website.";

    }
}

loadWebsite();

</script>

</body>
</html>
