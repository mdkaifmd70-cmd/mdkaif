<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading Website...</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f7fa;
    font-family:Arial,Helvetica,sans-serif;
}

.loader-box{
    text-align:center;
    background:#fff;
    padding:35px 45px;
    border-radius:14px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #ddd;
    border-top-color:#111;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 20px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error{
    color:#c62828;
    line-height:1.6;
}
</style>

</head>

<body>

<div class="loader-box" id="loader">
    <div class="spinner"></div>
    <h3>Loading Website...</h3>
    <p>Please wait</p>
</div>

<script>

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showError(message){

    document.getElementById("loader").innerHTML = `
        <div class="error">
            <h3>Website Loading Error</h3>
            <p>${escapeHTML(message)}</p>
        </div>
    `;

}


function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


async function loadClientWebsite(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );

        const clientId =
            params.get("client");


        if(!clientId){

            throw new Error(
                "Client ID is missing."
            );

        }


        const { data: client, error } =
            await supabaseClient
                .from("clients")
                .select(`
                    id,
                    company_name,
                    slug,
                    template,
                    status
                `)
                .eq("id",clientId)
                .single();


        if(error){

            throw error;

        }


        if(!client){

            throw new Error(
                "Client not found."
            );

        }


        /*
         * CLIENT STATUS CHECK
         */

        if(
            client.status &&
            String(client.status).toLowerCase()
                !== "active"
        ){

            throw new Error(
                "This client's website is inactive."
            );

        }


        /*
         * TEMPLATE SLUG
         */

        const templateSlug =
            String(
                client.template || ""
            )
            .trim()
            .toLowerCase();


        if(!templateSlug){

            throw new Error(
                "No template is assigned to this client."
            );

        }


        /*
         * FINAL TEMPLATE PATH
         *
         * Root:
         * templates/
         *
         * Template:
         * templates/industria/
         *
         * File:
         * templates/industria/index.html
         */

        const templatePath =
            "./templates/" +
            encodeURIComponent(templateSlug) +
            "/index.html?client=" +
            encodeURIComponent(clientId);


        /*
         * REDIRECT TO ACTUAL TEMPLATE
         */

        window.location.replace(
            templatePath
        );

    }

    catch(error){

        console.error(
            "Website Router Error:",
            error
        );

        showError(
            error.message ||
            "Unable to load website."
        );

    }

}


loadClientWebsite();

</script>

</body>
</html>
