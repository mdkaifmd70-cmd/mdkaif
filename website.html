<div id="website"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let clientData = null;
let templateData = null;

let categoriesData = [];
let productsData = [];
let productImagesData = [];
let galleryData = [];
let testimonialsData = [];
let faqsData = [];
let companySettingsData = null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getClientId(){

    const params =
        new URLSearchParams(window.location.search);

    return params.get("client");
}


function showError(message){

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("website").style.display =
        "none";

    document.getElementById("error").style.display =
        "flex";

    document.getElementById("errorMessage").textContent =
        message;
}


function showWebsite(){

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("error").style.display =
        "none";

    document.getElementById("website").style.display =
        "block";
}


/* =====================================================
   LOAD CLIENT
===================================================== */

async function loadClient(clientId){

    const {
        data,
        error
    } = await supabaseClient
        .from("clients")
        .select("*")
        .eq("id",clientId)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(!data){
        throw new Error(
            "Client not found."
        );
    }

    clientData = data;

    console.log(
        "Client loaded:",
        clientData
    );
}


/* =====================================================
   LOAD TEMPLATE
===================================================== */

async function loadTemplate(){

    if(!clientData.template){

        throw new Error(
            "No template has been assigned to this client."
        );
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("templates")
        .select("*")
        .or(
            `template_slug.eq.${clientData.template},slug.eq.${clientData.template}`
        )
        .limit(1)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(!data){

        throw new Error(
            "Selected template was not found."
        );
    }

    templateData = data;

    console.log(
        "Template loaded:",
        templateData
    );
}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories(){

    const {
        data,
        error
    } = await supabaseClient
        .from("categories")
        .select("*")
        .eq("client_id",clientData.id)
        .order("created_at",{ascending:true});

    if(error){

        console.warn(
            "Categories:",
            error.message
        );

        categoriesData = [];

        return;
    }

    categoriesData = data || [];
}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .eq("client_id",clientData.id)
        .order("created_at",{ascending:false});

    if(error){

        console.warn(
            "Products:",
            error.message
        );

        productsData = [];

        return;
    }

    productsData = data || [];
}


/* =====================================================
   LOAD PRODUCT IMAGES
===================================================== */

async function loadProductImages(){

        data,
        error
    } = await supabaseClient
        .from("product_images")

        .eq("client_id",clientData.id);

    if(error){

        console.warn(
            "Product Images:",
            error.message
        );

        productImagesData = [];

        return;
    }

    productImagesData = data || [];
}

   LOAD GALLERY

async function loadGallery(){

    const {
        data,

    } = await supabaseClient

        .order("created_at",{ascending:false});

    if(error){

        galleryData = [];

    }

    galleryData = data || [];
}


/* =====================================================
   LOAD TESTIMONIALS
===================================================== */

async function loadTestimonials(){

        error
    } = await supabaseClient

        .order("created_at",{ascending:false});

    if(error){

        );

        testimonialsData = [];

        return;
    }

    testimonialsData = data || [];
}


/* =====================================================
   LOAD FAQS
===================================================== */

async function loadFaqs(){

    const {
        data,
        error
    } = await supabaseClient
        .from("faqs")
        .select("*")
        .eq("client_id",clientData.id)
        .order("sort_order",{ascending:true});

    if(error){

        );

        faqsData = [];

    }

}


/* =====================================================
   LOAD COMPANY SETTINGS
===================================================== */

async function loadCompanySettings(){

    const {
        data,
        error
    } = await supabaseClient
        .from("company_settings")
        .select("*")
        .eq("client_id",clientData.id)
        .limit(1)
        .maybeSingle();

    if(error){

        console.warn(
            "Company Settings:",
            error.message
        );

        companySettingsData = null;

        return;
    }

    companySettingsData = data;
}


/* =====================================================
   FIND VALUE FROM OBJECT
===================================================== */

function findValue(object,keys){

    if(!object){
        return "";
    }

    for(const key of keys){

        if(
            object[key] !== undefined &&
            object[key] !== null &&
            object[key] !== ""
        ){

            return object[key];
        }
    }

    return "";
}


/* =====================================================
   GET COMPANY NAME
===================================================== */

function getCompanyName(){

    return findValue(
        companySettingsData,
        [
            "company_name",
            "business_name",
            "name"
        ]
    )
    ||
    clientData.company_name
    ||
    "Your Company";
}


/* =====================================================
   GET LOGO
===================================================== */

function getLogo(){

    return findValue(
        companySettingsData,
        [
            "logo_url",
            "logo",
            "company_logo"
        ]
    );
}


/* =====================================================
   GET PRODUCT IMAGE
===================================================== */

function getProductImage(product){

    const productId =
        product.id;

    const image =
        productImagesData.find(
            item =>
                item.product_id === productId
        );

    if(image){

        return findValue(
            image,
            [
                "image_url",
                "url",
                "image",
                "file_url"
            ]
        );
    }

    return findValue(
        product,
        [
            "image_url",
            "image",
            "photo",
            "product_image"
        ]
    );
}


/* =====================================================
   GET GALLERY IMAGE
===================================================== */

function getGalleryImage(item){

    return findValue(
        item,
        [
            "image_url",
            "url",
            "image",
            "file_url"
        ]
    );
}


/* =====================================================
   RENDER FALLBACK WEBSITE
===================================================== */

function renderFallbackWebsite(){

    const company =
        getCompanyName();

    const logo =
        getLogo();

    document.title =
        company;

    let html = "";


    /* HEADER */

    html += `
        <header class="site-header">

            <div class="site-brand">

                ${
                    logo
                    ?
                    `<img
                        src="${escapeHtml(logo)}"
                        alt="${escapeHtml(company)}"
                        style="
                            max-height:55px;
                            max-width:180px;
                            object-fit:contain;
                        "
                    >`
                    :
                    escapeHtml(company)
                }

            </div>


            <nav class="site-nav">

                <a href="#home">
                    Home
                </a>

                <a href="#products">
                    Products
                </a>

                <a href="#gallery">
                    Gallery
                </a>

                <a href="#contact">
                    Contact
                </a>

            </nav>

        </header>
    `;


    /* HERO */

    html += `
        <section
            id="home"
            class="hero"
        >

            <div class="hero-content">

                <h1>
                    ${escapeHtml(company)}
                </h1>

                <p>
                    Welcome to our official website.
                    Explore our products, services
                    and company information.
                </p>

            </div>

        </section>
    `;


    /* PRODUCTS */

    if(productsData.length){

        html += `
            <section
                id="products"
                class="section"
            >

                <div class="section-title">

                    <h2>
                        Our Products
                    </h2>

                </div>

                <div class="products-grid">
        `;


        productsData.forEach(product => {

            const name =
                findValue(
                    product,
                    [
                        "product_name",
                        "name",
                        "title"
                    ]
                ) ||
                "Product";


            const description =
                findValue(
                    product,
                    [
                        "description",
                        "short_description",
                        "details"
                    ]
                );


            const image =
                getProductImage(product);


            html += `

                <article class="product-card">

                    ${
                        image
                        ?
                        `
                        <img
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(name)}"
                        >
                        `
                        :
                        ""
                    }

                    <div class="product-info">

                        <h3>
                            ${escapeHtml(name)}
                        </h3>

                        ${
                            description
                            ?
                            `<p>
                                ${escapeHtml(description)}
                            </p>`
                            :
                            ""
                        }

                    </div>

                </article>

            `;

        });


        html += `
                </div>

            </section>
        `;
    }


    /* GALLERY */

    if(galleryData.length){

        html += `
            <section
                id="gallery"
                class="section"
            >

                <div class="section-title">

                    <h2>
                        Gallery
                    </h2>

                </div>

                <div class="gallery-grid">
        `;


        galleryData.forEach(item => {

            const image =
                getGalleryImage(item);

            if(!image){
                return;
            }

            html += `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(company)}"
                    loading="lazy"
                >

            `;

        });


        html += `
                </div>

            </section>
        `;
    }


    /* TESTIMONIALS */

    if(testimonialsData.length){

        html += `
            <section class="section">

                <div class="section-title">

                    <h2>
                        What Our Clients Say
                    </h2>

                </div>

                <div class="products-grid">
        `;


        testimonialsData.forEach(item => {

            const text =
                findValue(
                    item,
                    [
                        "testimonial",
                        "message",
                        "review",
                        "content"
                    ]
                );


            const name =
                findValue(
                    item,
                    [
                        "name",
                        "client_name",
                        "customer_name"
                    ]
                );


            html += `

                <article class="product-card">

                    <div class="product-info">

                        <p>
                            "${escapeHtml(text)}"
                        </p>

                        <strong>
                            ${escapeHtml(name)}
                        </strong>

                    </div>

                </article>

            `;

        });


        html += `
                </div>

            </section>
        `;
    }


    /* FAQ */

    if(faqsData.length){

        html += `
            <section class="section">

                <div class="section-title">

                    <h2>
                        Frequently Asked Questions
                    </h2>

                </div>
        `;


        faqsData.forEach(item => {

            const question =
                findValue(
                    item,
                    [
                        "question",
                        "title"
                    ]
                );


            const answer =
                findValue(
                    item,
                    [
                        "answer",
                        "content",
                        "description"
                    ]
                );


            html += `

                <details
                    style="
                        max-width:800px;
                        margin:15px auto;
                        padding:20px;
                        border:1px solid #ddd;
                        border-radius:10px;
                    "
                >

                    <summary
                        style="
                            cursor:pointer;
                            font-weight:bold;
                        "
                    >
                        ${escapeHtml(question)}
                    </summary>

                    <p>
                        ${escapeHtml(answer)}
                    </p>

                </details>

            `;

        });


        html += `
            </section>
        `;
    }


    /* FOOTER */

    html += `

        <footer
            id="contact"
            class="site-footer"
        >

            <h3>
                ${escapeHtml(company)}
            </h3>

            ${
                findValue(
                    companySettingsData,
                    [
                        "phone",
                        "mobile",
                        "contact_number"
                    ]
                )
                ?
                `
                <p>
                    Phone:
                    ${escapeHtml(
                        findValue(
                            companySettingsData,
                            [
                                "phone",
                                "mobile",
                                "contact_number"
                            ]
                        )
                    )}
                </p>
                `
                :
                ""
            }

            ${
                findValue(
                    companySettingsData,
                    [
                        "email",
                        "email_address"
                    ]
                )
                ?
                `
                <p>
                    Email:
                    ${escapeHtml(
                        findValue(
                            companySettingsData,
                            [
                                "email",
                                "email_address"
                            ]
                        )
                    )}
                </p>
                `
                :
                ""
            }

            <p>
                © ${new Date().getFullYear()}
                ${escapeHtml(company)}
            </p>

        </footer>

    `;


    document.getElementById(
        "website"
    ).innerHTML = html;

    showWebsite();
}


/* =====================================================
   LOAD EXTERNAL MASTER TEMPLATE
===================================================== */

async function tryLoadMasterTemplate(){

    const templateUrl =
        findValue(
            templateData,
            [
                "template_url",
                "url",
                "website_url",
                "github_url"
            ]
        );


    /*
       IMPORTANT:
       If template_url is empty,
       fallback website will be used.
    */

    if(!templateUrl){

        renderFallbackWebsite();

        return;
    }


    let finalUrl =
        templateUrl;


    /*
       Relative GitHub paths:
       templates/industria/
    */

    if(
        !/^https?:\/\//i.test(finalUrl)
    ){

        finalUrl =
            new URL(
                finalUrl,
                window.location.href
            ).href;
    }


    console.log(
        "Template URL:",
        finalUrl
    );


    /*
       For security and reliability,
       we keep the dynamic client rendering
       in this page.

       Master templates can later be converted
       to the common data-attribute system.

       Until then fallback renderer works.
    */

    renderFallbackWebsite();
}


/* =====================================================
   MAIN
===================================================== */

async function initWebsite(){

    try{

        const clientId =
            getClientId();


        if(!clientId){

            throw new Error(
                "Client ID is missing from the website URL."
            );
        }


        console.log(
            "Client ID:",
            clientId
        );


        /* CLIENT */

        await loadClient(
            clientId
        );


        /* TEMPLATE */

        await loadTemplate();


        /*
           Load all client data.
           Promise.all makes loading faster.
        */

        await Promise.all([

            loadCategories(),

            loadProducts(),

            loadProductImages(),

            loadGallery(),

            loadTestimonials(),

            loadFaqs(),

            loadCompanySettings()

        ]);


        console.log(
            "All website data loaded."
        );


        console.log(
            {
                client:clientData,
                template:templateData,
                categories:categoriesData,
                products:productsData,
                productImages:productImagesData,
                gallery:galleryData,
                testimonials:testimonialsData,
                faqs:faqsData,
                companySettings:companySettingsData
            }
        );


        /* RENDER */

        await tryLoadMasterTemplate();

    }
    catch(error){

        console.error(
            "Website Engine Error:",
            error
        );


        showError(
            error.message ||
            "Unable to load website."
        );

    }

}


/* START */

initWebsite();

</script>

</body>
</html>
