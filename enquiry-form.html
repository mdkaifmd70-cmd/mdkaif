```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Send Enquiry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

.box{
  width:min(720px,calc(100% - 30px));
  margin:40px auto;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(15,23,42,.08);
  padding:28px
}

.head h1{
  margin:0 0 7px;
  font-size:28px
}

.head p{
  margin:0 0 24px;
  color:#64748b
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#475569;
  margin:0 0 7px
}

.field{
  margin-bottom:15px
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font:inherit;
  outline:none
}

textarea{
  min-height:150px;
  resize:vertical
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1)
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  padding:13px 18px;
  font-weight:800;
  font-size:14px;
  cursor:pointer
}

button:hover{
  background:#1d4ed8
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.notice{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:16px;
  font-size:13px;
  font-weight:700
}

.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
  border:1px solid #bbf7d0
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca
}

.small{
  font-size:12px;
  color:#64748b;
  margin-top:12px
}

.loading{
  color:#64748b;
  font-size:13px
}

@media(max-width:650px){
  .two{
    grid-template-columns:1fr
  }

  .box{
    padding:20px;
    margin:20px auto
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="head">
    <h1>Send an Enquiry</h1>
    <p>Fill in your details and our team will contact you.</p>
  </div>

  <div id="notice" class="notice"></div>

  <form id="form" onsubmit="submitEnquiry(event)">

    <div class="two">

      <div class="field">
        <label>Customer Name *</label>
        <input
          id="customer_name"
          required
          maxlength="150"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label>Company Name</label>
        <input
          id="company_name"
          maxlength="200"
          autocomplete="organization"
        >
      </div>

      <div class="field">
        <label>Phone *</label>
        <input
          id="phone"
          required
          maxlength="50"
          autocomplete="tel"
        >
      </div>

      <div class="field">
        <label>Email</label>
        <input
          id="email"
          type="email"
          maxlength="180"
          autocomplete="email"
        >
      </div>

    </div>

    <div class="field">
      <label>Product</label>

      <select id="product_id">
        <option value="">General Enquiry</option>
      </select>

      <div id="productLoading" class="loading" style="display:none">
        Loading products...
      </div>
    </div>

    <div class="field">
      <label>Your Requirement *</label>

      <textarea
        id="requirement"
        required
        maxlength="5000"
        placeholder="Tell us what you need..."
      ></textarea>
    </div>

    <button id="submitBtn" type="submit">
      Submit Enquiry
    </button>

    <div class="small">
      Your enquiry will be securely submitted to the selected client website.
    </div>

  </form>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  'https://ywvdozdoanmcxscfofcf.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   URL PARAMETERS
   Example:
   enquiry.html?client_id=UUID
   enquiry.html?client_id=UUID&product_id=UUID
   ========================================================= */

const params =
  new URLSearchParams(window.location.search);

const CLIENT_ID =
  params.get('client_id');

const PRODUCT_ID =
  params.get('product_id');


/* =========================================================
   NOTICE
   ========================================================= */

function notice(message,type){

  const n =
    document.getElementById('notice');

  n.textContent = message;

  n.className =
    'notice ' + type;

  n.style.display = 'block';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts(){

  const select =
    document.getElementById('product_id');

  const loading =
    document.getElementById('productLoading');


  /* Client ID missing */

  if(!CLIENT_ID){

    select.disabled = true;

    return;
  }


  loading.style.display = 'block';


  try{

    /*
      Product list is only used for display.

      IMPORTANT:
      Final product/client validation happens
      again inside Supabase RPC function.
    */

    const { data,error } =
      await supabaseClient
      .from('products')
      .select(
        'id,name,product_code,status'
      )
      .eq('client_id',CLIENT_ID)
      .eq('status','active')
      .order('name');


    if(error){

      console.error(
        'Product loading error:',
        error
      );

      loading.style.display = 'none';

      return;
    }


    /*
      Remove existing product options
      except General Enquiry.
    */

    select.innerHTML =
      '<option value="">General Enquiry</option>';


    for(const p of (data || [])){

      const option =
        document.createElement('option');

      option.value =
        p.id;

      option.textContent =
        p.product_code
        ? `${p.name} (${p.product_code})`
        : p.name;

      select.appendChild(option);
    }


    /*
      If product_id is supplied in URL,
      automatically select it.
    */

    if(PRODUCT_ID){

      const productExists =
        Array.from(select.options)
        .some(
          option =>
            option.value === PRODUCT_ID
        );

      if(productExists){

        select.value =
          PRODUCT_ID;

      }else{

        /*
          Do not force an invalid product.
        */

        select.value = '';

      }
    }


  }catch(error){

    console.error(
      'Unexpected product loading error:',
      error
    );

  }finally{

    loading.style.display = 'none';

  }
}


/* =========================================================
   SUBMIT ENQUIRY
   ========================================================= */

async function submitEnquiry(e){

  e.preventDefault();


  /* =======================================================
     CLIENT CHECK
     ======================================================= */

  if(!CLIENT_ID){

    notice(
      'Client is not configured. Please use a valid enquiry link.',
      'error'
    );

    return;
  }


  /* =======================================================
     GET FORM VALUES
     ======================================================= */

  const customerName =
    document
    .getElementById('customer_name')
    .value
    .trim();

  const companyName =
    document
    .getElementById('company_name')
    .value
    .trim();

  const phone =
    document
    .getElementById('phone')
    .value
    .trim();

  const email =
    document
    .getElementById('email')
    .value
    .trim();

  const productId =
    document
    .getElementById('product_id')
    .value || null;

  const requirement =
    document
    .getElementById('requirement')
    .value
    .trim();


  /* =======================================================
     BASIC VALIDATION
     ======================================================= */

  if(!customerName){

    notice(
      'Please enter your name.',
      'error'
    );

    return;
  }


  if(!phone){

    notice(
      'Please enter your phone number.',
      'error'
    );

    return;
  }


  if(!requirement){

    notice(
      'Please enter your requirement.',
      'error'
    );

    return;
  }


  /* =======================================================
     BUTTON LOCK
     ======================================================= */

  const btn =
    document.getElementById('submitBtn');

  btn.disabled = true;

  btn.textContent =
    'Submitting...';


  try{

    /* =====================================================
       SECURE SUPABASE RPC

       Direct INSERT is NOT used.

       Database function:
       submit_enquiry()

       It validates:
       - client
       - client status
       - product
       - product ownership
       ===================================================== */

    const { data,error } =
      await supabaseClient.rpc(
        'submit_enquiry',
        {
          p_client_id: CLIENT_ID,

          p_product_id: productId,

          p_customer_name: customerName,

          p_company_name:
            companyName || null,

          p_phone: phone,

          p_email:
            email || null,

          p_requirement:
            requirement,

          p_source:
            'Website'
        }
      );


    /* =====================================================
       ERROR
       ===================================================== */

    if(error){

      console.error(
        'Enquiry submission error:',
        error
      );


      let message =
        error.message ||
        'Unable to submit enquiry.';


      /*
        Friendly messages for known
        database validation errors.
      */

      if(
        message
        .toLowerCase()
        .includes('invalid or inactive client')
      ){

        message =
          'This enquiry form is not active or the client is invalid.';

      }


      if(
        message
        .toLowerCase()
        .includes('invalid product')
      ){

        message =
          'The selected product is not available for this client.';

      }


      notice(
        message,
        'error'
      );


      btn.disabled = false;

      btn.textContent =
        'Submit Enquiry';

      return;
    }


    /* =====================================================
       SUCCESS
       ===================================================== */

    document
      .getElementById('form')
      .reset();


    /*
      Restore product if the URL contained
      a valid product_id.
    */

    if(PRODUCT_ID){

      const select =
        document.getElementById('product_id');

      const exists =
        Array.from(select.options)
        .some(
          option =>
            option.value === PRODUCT_ID
        );

      if(exists){

        select.value =
          PRODUCT_ID;

      }
    }


    notice(
      'Thank you. Your enquiry has been submitted successfully.',
      'ok'
    );


  }catch(error){

    console.error(
      'Unexpected submission error:',
      error
    );

    notice(
      'Something went wrong. Please try again later.',
      'error'
    );


  }finally{

    btn.disabled = false;

    btn.textContent =
      'Submit Enquiry';

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

loadProducts();

</script>

</body>
</html>
