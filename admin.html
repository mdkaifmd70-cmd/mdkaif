```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MD KAIF - Admin Login</title>

<!-- Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#ffffff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:30px;
    color:#0f172a;
    font-weight:800;
}

.logo p{
    margin-top:7px;
    color:#64748b;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.login-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#1d4ed8;
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:18px;
    padding:12px 14px;
    border-radius:9px;
    font-size:14px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
}

.message.success{
    display:block;
    background:#f0fdf4;
    color:#15803d;
    border:1px solid #bbf7d0;
}

.footer{
    text-align:center;
    margin-top:22px;
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>MD KAIF</h1>
        <p>Web Platform Admin</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button
            type="submit"
            id="loginBtn"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div class="footer">
        MDKF Web Platform
    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://ywvdozdoanmcxscfofc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";


/* =========================================================
   CHECK SUPABASE LIBRARY
========================================================= */

if(
    !window.supabase ||
    typeof window.supabase.createClient !== "function"
){
    alert(
        "Supabase library could not load. " +
        "Please check your internet connection and refresh the page."
    );
}


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true,
            storage:window.localStorage
        }
    }
);


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const messageBox =
document.getElementById("message");


/* =========================================================
   MESSAGE FUNCTION
========================================================= */

function showMessage(text,type){

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;

}

function clearMessage(){

    messageBox.textContent = "";

    messageBox.className =
        "message";

}


/* =========================================================
   BUTTON STATE
========================================================= */

function setLoading(loading){

    loginBtn.disabled = loading;

    if(loading){

        loginBtn.textContent =
            "Logging in...";

    }else{

        loginBtn.textContent =
            "Login";

    }

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

async function checkExistingSession(){

    try{

        console.log(
            "Checking existing Supabase session..."
        );

        const result =
        await supabaseClient.auth.getSession();

        const sessionData =
            result.data;

        const sessionError =
            result.error;

        if(sessionError){

            console.error(
                "Session check error:",
                sessionError
            );

            return;

        }

        const session =
            sessionData &&
            sessionData.session;

        if(session){

            console.log(
                "Existing session found:",
                session.user.email
            );

            /*
             * Already logged in.
             * Go directly to dashboard.
             */
            window.location.replace(
                "dashboard.html"
            );

        }else{

            console.log(
                "No existing session."
            );

        }

    }catch(error){

        console.error(
            "Existing session exception:",
            error
        );

    }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;
        }

        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        setLoading(true);


        try{

            console.log(
                "Attempting Supabase login..."
            );

            /*
             * LOGIN
             */
            const result =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


            const data =
                result.data;

            const error =
                result.error;


            /*
             * Supabase returned an error
             */
            if(error){

                console.error(
                    "Supabase Login Error:",
                    error
                );

                let errorMessage =
                    error.message ||
                    "Login failed.";

                /*
                 * Better message for network failure
                 */
                if(
                    errorMessage
                    .toLowerCase()
                    .includes("failed to fetch")
                ){

                    errorMessage =
                    "Failed to fetch Supabase. " +
                    "Please check your internet connection, " +
                    "Supabase URL, and browser network access.";

                }

                showMessage(
                    errorMessage,
                    "error"
                );

                setLoading(false);

                return;

            }


            /*
             * Login succeeded but session missing
             */
            if(
                !data ||
                !data.session
            ){

                console.error(
                    "Login succeeded but no session returned.",
                    data
                );

                showMessage(
                    "Login completed but session was not created. Please try again.",
                    "error"
                );

                setLoading(false);

                return;

            }


            console.log(
                "Login successful:",
                data.user.email
            );

            console.log(
                "Session created successfully."
            );


            /*
             * Verify session from Supabase storage
             */
            const sessionCheck =
            await supabaseClient.auth.getSession();

            if(
                sessionCheck.error
            ){

                console.error(
                    "Session verification error:",
                    sessionCheck.error
                );

                showMessage(
                    "Login successful, but session verification failed.",
                    "error"
                );

                setLoading(false);

                return;

            }


            const verifiedSession =
                sessionCheck.data &&
                sessionCheck.data.session;


            if(!verifiedSession){

                console.error(
                    "Verified session is missing."
                );

                showMessage(
                    "Session could not be saved. Please try again.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /*
             * SUCCESS
             */
            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
             * Small delay so user sees success message.
             */
            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            },500);


        }catch(error){

            console.error(
                "Login Exception:",
                error
            );


            let errorMessage =
                error &&
                error.message
                ? error.message
                : "Unexpected login error.";


            /*
             * Network / Failed to fetch
             */
            if(
                errorMessage
                .toLowerCase()
                .includes("failed to fetch")
            ){

                errorMessage =
                "Failed to fetch Supabase. " +
                "Check your internet connection or Supabase configuration.";

            }


            showMessage(
                errorMessage,
                "error"
            );

            setLoading(false);

        }

    }
);


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        console.log(
            "Supabase Auth Event:",
            event
        );

        if(session){

            console.log(
                "Authenticated user:",
                session.user.email
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

checkExistingSession();

</script>

</body>
</html>
```
