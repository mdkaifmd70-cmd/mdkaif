<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - MD Kaif Web Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(15,23,42,.12);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:900;
    color:#0f172a;
    margin-bottom:8px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:30px;
}

label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:7px;
    color:#334155;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    margin-bottom:18px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.login-btn{
    width:100%;
    border:0;
    background:#2563eb;
    color:white;
    padding:13px;
    border-radius:9px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.login-btn:hover{
    background:#1d4ed8;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-size:13px;
    line-height:1.5;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        MD <span>KAIF</span>
    </div>

    <div class="subtitle">
        Web Platform Admin Login
    </div>

    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Login

        </button>

    </form>

    <div
        id="message"
        class="message">
    </div>

    <a
        href="index.html"
        class="back">

        ← Back to Website

    </a>

</div>

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://ywvdozdoanmcxscfofc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =========================================
   MESSAGE FUNCTION
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        /* -------------------------------
           VALIDATION
        -------------------------------- */

        if(!email || !password){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;
        }


        /* -------------------------------
           BUTTON LOADING
        -------------------------------- */

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            /* ---------------------------
               SUPABASE LOGIN
            ---------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            /* ---------------------------
               LOGIN ERROR
            ---------------------------- */

            if(error){

                console.error(
                    "Login Error:",
                    error
                );

                showMessage(
                    error.message,
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;
            }


            /* ---------------------------
               USER CHECK
            ---------------------------- */

            if(
                !data ||
                !data.user
            ){

                showMessage(
                    "Login failed. User session was not created.",
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;
            }


            /* ---------------------------
               VERIFY SESSION
            ---------------------------- */

            const {
                data: sessionData,
                error: sessionError
            } =
            await supabaseClient
                .auth
                .getSession();


            if(sessionError){

                console.error(
                    "Session Error:",
                    sessionError
                );

                showMessage(
                    "Login succeeded but session could not be verified.",
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;
            }


            if(
                !sessionData ||
                !sessionData.session ||
                !sessionData.session.user
            ){

                showMessage(
                    "Login session could not be created. Please try again.",
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;
            }


            /* ---------------------------
               SUCCESS
            ---------------------------- */

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
              replace() is used instead of
              href() so browser history does
              not create an unnecessary
              login/dashboard loop.
            */

            setTimeout(
                function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                500
            );

        }
        catch(error){

            console.error(
                "Unexpected Login Error:",
                error
            );

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";
        }

    }
);

</script>

</body>
</html>
