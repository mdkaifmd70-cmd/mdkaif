<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - MD Kaif Web Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;

    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#ffffff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(15,23,42,.12);

.logo{

    border-color:#2563eb;

    background:#1d4ed8;

    opacity:.6;
    cursor:not-allowed;
}

    margin-top:15px;

}

.message.error{
    display:block;

    display:block;

    display:block;

<body>

<div class="login-box">

    <div class="logo">
        MD <span>KAIF</span>
    </div>

    <div class="subtitle">
        Web Platform Admin Login
    </div>


    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Login

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="index.html"
        class="back">

        ← Back to Website

    </a>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   RESET LOGIN BUTTON
===================================================== */

function resetButton(){

    loginBtn.disabled =
        false;

    loginBtn.textContent =
        "Login";

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        try{

            /* =========================================
               SIGN IN
            ========================================= */

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            /* =========================================
               LOGIN ERROR
            ========================================= */

            if(error){

                console.error(
                    "Supabase Login Error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Login failed.",
                    "error"
                );

                resetButton();

                return;

            }


            /* =========================================
               USER CHECK
            ========================================= */

            if(
                !data ||
                !data.user
            ){

                showMessage(
                    "Login failed. User was not found.",
                    "error"
                );

                resetButton();

                return;

            }


            /* =========================================
               VERIFY SESSION
            ========================================= */

            const {
                data:sessionData,
                error:sessionError
            } =
            await supabaseClient
                .auth
                .getSession();


            if(sessionError){

                console.error(
                    "Session Verification Error:",
                    sessionError
                );

                showMessage(
                    "Login succeeded, but session could not be verified.",
                    "error"
                );

                resetButton();

                return;

            }


            const session =
                sessionData?.session;


            if(
                !session ||
                !session.user
            ){

                showMessage(
                    "Login session was not created. Please try again.",
                    "error"
                );

                resetButton();

                return;

            }


            /* =========================================
               LOGIN SUCCESS
            ========================================= */

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
              replace() prevents browser history
              from creating unnecessary login loops.
            */

            setTimeout(
                function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                500
            );

        }
        catch(error){

            console.error(
                "Unexpected Login Error:",
                error
            );

            showMessage(
                error?.message ||
                "Something went wrong. Please try again.",
                "error"
            );

            resetButton();

        }

    }
);


/* =====================================================
   IMPORTANT
   =====================================================

   NO automatic getSession() redirect here.

   Reason:
   dashboard.html also checks the session.
   Having both pages automatically redirect each
   other can create an infinite blinking loop.

   User will reach dashboard only after successful
   login above.

===================================================== */


</script>

</body>
</html>
