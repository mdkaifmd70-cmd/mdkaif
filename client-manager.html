<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clients - MD Kaif Web Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CLIENT CONTEXT -->
<script src="client-context.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

button,
input,
select{
    font-family:inherit;
}

.container{
    width:min(1400px,94%);
    margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
    background:#0b1628;
    color:#fff;
    padding:18px 0;
}

.header-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:45px;
    height:45px;
    background:#0b5ed7;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.brand h1{
    font-size:21px;
}

.brand p{
    font-size:12px;
    color:#aeb9c8;
    margin-top:2px;
}

.header-actions{
    display:flex;
    gap:10px;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:0;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:#0b5ed7;
    color:#fff;
}

.btn-secondary{
    background:#e9eef6;
    color:#172033;
}

.btn-danger{
    background:#dc3545;
    color:#fff;
}

.btn-dark{
    background:#172033;
    color:#fff;
}

.btn-success{
    background:#198754;
    color:#fff;
}

/* =========================
   PAGE
========================= */

.page{
    padding:30px 0 60px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.page-title h2{
    font-size:30px;
}

.page-title p{
    color:#667085;
    margin-top:5px;
}

/* =========================
   MESSAGE
========================= */

#message{
    display:none;
    padding:13px 16px;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:600;
}

.message-success{
    background:#d1e7dd;
    color:#0f5132;
}

.message-error{
    background:#f8d7da;
    color:#842029;
}

/* =========================
   FORM CARD
========================= */

.form-card{
    background:#fff;
    border:1px solid #e3e8ef;
    border-radius:12px;
    padding:25px;
    margin-bottom:28px;
    box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.form-card h3{
    margin-bottom:20px;
    font-size:21px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:14px;
    font-weight:700;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px 13px;
    border:1px solid #d5dce6;
    border-radius:7px;
    outline:none;
    background:#fff;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#0b5ed7;
    box-shadow:0 0 0 3px rgba(11,94,215,.1);
}

.form-actions{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:#fff;
    border:1px solid #e3e8ef;
    padding:16px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:250px;
}

.search-box input{
    width:100%;
    padding:11px 13px;
    border:1px solid #d5dce6;
    border-radius:7px;
}

.count-box{
    font-weight:700;
    color:#667085;
}

/* =========================
   TABLE
========================= */

.table-card{
    background:#fff;
    border:1px solid #e3e8ef;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:#0b1628;
    color:#fff;
}

th,
td{
    padding:14px 12px;
    text-align:left;
    border-bottom:1px solid #e9edf2;
    vertical-align:middle;
}

th{
    font-size:13px;
    white-space:nowrap;
}

td{
    font-size:14px;
}

tbody tr:hover{
    background:#f8fafc;
}

.company-name{
    font-weight:800;
    color:#172033;
}

.slug{
    color:#667085;
    font-size:12px;
    margin-top:3px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.status-active{
    background:#d1e7dd;
    color:#0f5132;
}

.status-inactive{
    background:#f8d7da;
    color:#842029;
}

.status-other{
    background:#e9ecef;
    color:#495057;
}

/* =========================
   ACTIONS
========================= */

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.actions button{
    border:0;
    padding:7px 9px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.use-btn{
    background:#198754;
    color:#fff;
}

.preview-btn{
    background:#6f42c1;
    color:#fff;
}

.website-btn{
    background:#0b5ed7;
    color:#fff;
}

.edit-btn{
    background:#ffc107;
    color:#172033;
}

.delete-btn{
    background:#dc3545;
    color:#fff;
}

.disabled-btn{
    background:#adb5bd !important;
    color:#fff !important;
    cursor:not-allowed !important;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:50px;
    color:#667085;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e6ebf2;
    border-top-color:#0b5ed7;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#667085;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .form-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .header-inner,
    .page-title{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
    }

    .header-actions .btn{
        flex:1;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .page-title h2{
        font-size:25px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="container header-inner">

        <div class="brand">

            <div class="brand-logo">
                MD
            </div>

            <div>

                <h1>
                    MD Kaif Web Platform
                </h1>

                <p>
                    Client Manager
                </p>

            </div>

        </div>

        <div class="header-actions">

            <button
                class="btn btn-secondary"
                onclick="location.reload()">
                🔄 Refresh
            </button>

            <button
                class="btn btn-danger"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</header>


<!-- =========================
     PAGE
========================= -->

<main class="page">

<div class="container">


    <!-- TITLE -->

    <div class="page-title">

        <div>

            <h2>
                Client Manager
            </h2>

            <p>
                Manage clients, templates and websites
            </p>

        </div>

        <button
            class="btn btn-primary"
            onclick="newClient()">
            + Add Client
        </button>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- =========================
         CLIENT FORM
    ========================= -->

    <div class="form-card">

        <h3 id="formTitle">
            Add New Client
        </h3>


        <form
            id="clientForm"
            onsubmit="saveClient(event)">

            <input
                type="hidden"
                id="clientId">


            <div class="form-grid">


                <!-- COMPANY -->

                <div class="form-group">

                    <label>
                        Company Name *
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        required
                        placeholder="Company Name">

                </div>


                <!-- SLUG -->

                <div class="form-group">

                    <label>
                        Slug *
                    </label>

                    <input
                        type="text"
                        id="slug"
                        required
                        placeholder="company-name">

                </div>


                <!-- DOMAIN -->

                <div class="form-group">

                    <label>
                        Domain
                    </label>

                    <input
                        type="text"
                        id="domain"
                        placeholder="example.com">

                </div>


                <!-- HOSTING TYPE -->

                <div class="form-group">

                    <label>
                        Hosting Type
                    </label>

                    <input
                        type="text"
                        id="hostingType"
                        placeholder="GitHub / Hostinger / Other">

                </div>


                <!-- HOSTING URL -->

                <div class="form-group">

                    <label>
                        Hosting URL
                    </label>

                    <input
                        type="text"
                        id="hostingUrl"
                        placeholder="https://example.github.io">

                </div>


                <!-- TEMPLATE -->

                <div class="form-group">

                    <label>
                        Website Template *
                    </label>

                    <select
                        id="template"
                        required>

                        <option value="">
                            Loading templates...
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="status">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveButton">
                    Save Client
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="newClient()">
                    Clear
                </button>

            </div>

        </form>

    </div>


    <!-- =========================
         TOOLBAR
    ========================= -->

    <div class="toolbar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search company, slug, domain, template..."
                oninput="filterClients()">

        </div>

        <div
            class="count-box"
            id="clientCount">
            0 Clients
        </div>

    </div>


    <!-- =========================
         TABLE
    ========================= -->

    <div class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Company
                        </th>

                        <th>
                            Domain
                        </th>

                        <th>
                            Hosting
                        </th>

                        <th>
                            Template
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Created
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="clientsBody">

                    <tr>

                        <td
                            colspan="7"
                            class="loading">

                            <div class="spinner"></div>

                            Loading clients...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</main>


<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================================
   GLOBAL DATA
========================================================== */

let allClients = [];
let allTemplates = [];


/* ==========================================================
   MESSAGE
========================================================== */

function showMessage(
    text,
    type = "success"
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        type === "error"
        ? "message-error"
        : "message-success";

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    },4000);

}


/* ==========================================================
   TEMPLATE HELPERS
========================================================== */

function getTemplateValue(row){

    return (
        row.slug ||
        row.template_slug ||
        row.name ||
        row.template_name ||
        row.title ||
        row.template ||
        row.code ||
        row.template_code ||
        ""
    );

}


function getTemplateDisplayName(row){

    return (
        row.name ||
        row.template_name ||
        row.title ||
        row.display_name ||
        row.slug ||
        row.template ||
        row.code ||
        row.template_code ||
        "Template"
    );

}


function findTemplateRow(
    templateValue
){

    return allTemplates.find(
        row =>
            String(
                getTemplateValue(row)
            ).toLowerCase()
            ===
            String(
                templateValue || ""
            ).toLowerCase()
    );

}


/* ==========================================================
   LOAD TEMPLATES
========================================================== */

async function loadTemplates(){

    const select =
        document.getElementById(
            "template"
        );


    const {
        data,
        error
    } = await supabaseClient
        .from("templates")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Template error:",
            error
        );

        select.innerHTML = `

            <option value="">
                Unable to load templates
            </option>

        `;

        return;

    }


    allTemplates =
        data || [];


    select.innerHTML = `

        <option value="">
            Select Template
        </option>

    `;


    allTemplates.forEach(
        row => {

            const value =
                getTemplateValue(row);

            const display =
                getTemplateDisplayName(row);


            if(!value){

                return;

            }


            const option =
                document.createElement(
                    "option"
                );

            option.value =
                value;

            option.textContent =
                display;

            select.appendChild(
                option
            );

        }
    );

}


/* ==========================================================
   LOAD CLIENTS
========================================================== */

async function loadClients(){

    const body =
        document.getElementById(
            "clientsBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading">

                <div class="spinner"></div>

                Loading clients...

            </td>

        </tr>

    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Client loading error:",
            error
        );


        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    Failed to load clients.<br>

                    ${escapeHTML(
                        error.message || ""
                    )}

                </td>

            </tr>

        `;

        return;

    }


    allClients =
        data || [];


    renderClients(
        allClients
    );

}


/* ==========================================================
   RENDER CLIENTS
========================================================== */

function renderClients(
    clients
){

    const body =
        document.getElementById(
            "clientsBody"
        );


    document.getElementById(
        "clientCount"
    ).textContent =
        `${clients.length} Client${
            clients.length === 1
            ? ""
            : "s"
        }`;


    if(!clients.length){

        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    No clients found.

                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML = "";


    clients.forEach(
        client => {

            const tr =
                document.createElement(
                    "tr"
                );


            /* =========================
               COMPANY
            ========================= */

            const company =
                escapeHTML(
                    client.company_name ||
                    "Unnamed Client"
                );


            const slug =
                escapeHTML(
                    client.slug || ""
                );


            /* =========================
               DOMAIN
            ========================= */

            const domain =
                client.domain
                ?
                escapeHTML(
                    client.domain
                )
                :
                "—";


            /* =========================
               HOSTING
            ========================= */

            const hostingType =
                escapeHTML(
                    client.hosting_type ||
                    "—"
                );


            const hostingUrl =
                escapeHTML(
                    client.hosting_url ||
                    ""
                );


            /* =========================
               TEMPLATE
            ========================= */

            const templateRow =
                findTemplateRow(
                    client.template
                );


            const templateName =
                templateRow
                ?
                getTemplateDisplayName(
                    templateRow
                )
                :
                (
                    client.template ||
                    "—"
                );


            /* =========================
               STATUS
            ========================= */

            const status =
                String(
                    client.status ||
                    "active"
                ).toLowerCase();


            let statusClass =
                "status-other";


            if(status === "active"){

                statusClass =
                    "status-active";

            }else if(
                status === "inactive"
            ){

                statusClass =
                    "status-inactive";

            }


            /* =========================
               DATE
            ========================= */

            let created =
                "—";


            if(client.created_at){

                created =
                    new Date(
                        client.created_at
                    ).toLocaleDateString(
                        "en-IN",
                        {
                            day:"2-digit",
                            month:"short",
                            year:"numeric"
                        }
                    );

            }


            /* =========================
               WEBSITE BUTTON
            ========================= */

            let websiteButton =
                "";


            const actualWebsite =
                getActualWebsiteUrl(
                    client
                );


            if(actualWebsite){

                websiteButton = `

                    <button
                        class="website-btn"
                        onclick="openWebsite('${escapeJS(client.id)}')">

                        🌐 Website

                    </button>

                `;

            }else{

                websiteButton = `

                    <button
                        class="website-btn disabled-btn"
                        disabled>

                        🌐 Website

                    </button>

                `;

            }


            /* =========================
               ROW
            ========================= */

            tr.innerHTML = `

                <td>

                    <div class="company-name">
                        ${company}
                    </div>

                    <div class="slug">
                        ${slug}
                    </div>

                </td>


                <td>
                    ${domain}
                </td>


                <td>

                    <strong>
                        ${hostingType}
                    </strong>

                    ${
                        hostingUrl
                        ?
                        `<div class="slug">
                            ${hostingUrl}
                        </div>`
                        :
                        ""
                    }

                </td>


                <td>
                    ${escapeHTML(
                        templateName
                    )}
                </td>


                <td>

                    <span
                        class="status ${statusClass}">

                        ${escapeHTML(
                            client.status ||
                            "active"
                        )}

                    </span>

                </td>


                <td>
                    ${created}
                </td>


                <td>

                    <div class="actions">


                        <!-- USE CLIENT -->

                        <button
                            class="use-btn"
                            onclick="useClient('${escapeJS(client.id)}')">

                            ✓ Use

                        </button>


                        <!-- PREVIEW -->

                        <button
                            class="preview-btn"
                            onclick="previewTemplate('${escapeJS(client.id)}')">

                            👁 Preview

                        </button>


                        <!-- ACTUAL WEBSITE -->

                        ${websiteButton}


                        <!-- EDIT -->

                        <button
                            class="edit-btn"
                            onclick="editClient('${escapeJS(client.id)}')">

                            ✏ Edit

                        </button>


                        <!-- DELETE -->

                        <button
                            class="delete-btn"
                            onclick="deleteClient('${escapeJS(client.id)}')">

                            🗑 Delete

                        </button>


                    </div>

                </td>

            `;


            body.appendChild(
                tr
            );

        }
    );

}


/* ==========================================================
   ACTUAL WEBSITE URL
========================================================== */

function getActualWebsiteUrl(
    client
){

    let url =
        client.domain ||
        client.hosting_url ||
        "";


    if(!url){

        return "";

    }


    url =
        String(url).trim();


    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        url =
            "https://" +
            url;

    }


    return url;

}


/* ==========================================================
   PREVIEW CLIENT WEBSITE
========================================================== */

window.previewTemplate =
async function(id){

    if(!id){

        showMessage(
            "Client ID is missing.",
            "error"
        );

        return;

    }


    /*
     * IMPORTANT:
     *
     * Preview no longer depends on
     * templates.template_url.
     *
     * It opens our common dynamic
     * website engine.
     *
     * website.html?client=CLIENT_ID
     */


    const previewUrl =
        "website.html?client=" +
        encodeURIComponent(id);


    window.open(
        previewUrl,
        "_blank",
        "noopener,noreferrer"
    );

};


/* ==========================================================
   OPEN ACTUAL WEBSITE
========================================================== */

window.openWebsite =
async function(id){

    try{

        const {
            data:client,
            error
        } = await supabaseClient
            .from("clients")
            .select(
                "id,company_name,domain,hosting_url"
            )
            .eq(
                "id",
                id
            )
            .single();


        if(error){

            throw error;

        }


        const url =
            getActualWebsiteUrl(
                client
            );


        if(!url){

            showMessage(
                "No domain or hosting URL is configured for this client.",
                "error"
            );

            return;

        }


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );


    }catch(error){

        console.error(
            error
        );

        showMessage(
            "Unable to open website.",
            "error"
        );

    }

};


/* ==========================================================
   USE CLIENT
========================================================== */

window.useClient =
async function(id){

    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("clients")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


        if(error){

            throw error;

        }


        if(
            typeof MDKClientContext !==
            "undefined" &&
            MDKClientContext.set
        ){

            MDKClientContext.set(
                data
            );

        }


        showMessage(
            `${data.company_name} is now active client.`
        );


    }catch(error){

        console.error(
            error
        );

        showMessage(
            "Unable to select client.",
            "error"
        );

    }

};

/* ==========================================================
   SAVE / UPDATE CLIENT
========================================================== */

window.saveClient =
async function(event){

    event.preventDefault();


    const id =
        document.getElementById(
            "clientId"
        ).value.trim();


    const company_name =
        document.getElementById(
            "companyName"
        ).value.trim();


    const slug =
        document.getElementById(
            "slug"
        ).value.trim();


    const domain =
        document.getElementById(
            "domain"
        ).value.trim();


    const hosting_type =
        document.getElementById(
            "hostingType"
        ).value.trim();


    const hosting_url =
        document.getElementById(
            "hostingUrl"
        ).value.trim();


    const template =
        document.getElementById(
            "template"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value;


    if(!company_name){

        showMessage(
            "Company name is required.",
            "error"
        );

        return;

    }


    if(!slug){

        showMessage(
            "Slug is required.",
            "error"
        );

        return;

    }


    if(!template){

        showMessage(
            "Please select a template.",
            "error"
        );

        return;

    }


    const payload = {

        company_name,

        slug,

        domain:
            domain || null,

        hosting_type:
            hosting_type || null,

        hosting_url:
            hosting_url || null,

        template,

        status

    };


    try{

        let result;


        if(id){

            result =
                await supabaseClient
                    .from("clients")
                    .update(
                        payload
                    )
                    .eq(
                        "id",
                        id
                    )
                    .select()
                    .single();


        }else{

            result =
                await supabaseClient
                    .from("clients")
                    .insert(
                        payload
                    )
                    .select()
                    .single();

        }


        if(result.error){

            throw result.error;

        }


        const savedClient =
            result.data;


        if(
            typeof MDKClientContext !==
            "undefined" &&
            MDKClientContext.set
        ){

            MDKClientContext.set(
                savedClient
            );

        }


        showMessage(
            id
            ?
            "Client updated successfully."
            :
            "Client created successfully."
        );


        newClient();


        await loadClients();


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Unable to save client.",
            "error"
        );

    }

};

/* ==========================================================
   DELETE CLIENT
========================================================== */

window.deleteClient =
async function(id){

    const client =
        allClients.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    const company =
        client
        ?
        client.company_name
        :
        "this client";


    const confirmed =
        confirm(
            `Delete "${company}" permanently?\n\nThis action cannot be undone.`
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } = await supabaseClient
            .from("clients")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        showMessage(
            "Client deleted successfully."
        );


        await loadClients();


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Unable to delete client.",
            "error"
        );

    }

};


/* ==========================================================
   SEARCH
========================================================== */

window.filterClients =
function(){

    const query =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(!query){

        renderClients(
            allClients
        );

        return;

    }


    const filtered =
        allClients.filter(
            client => {

                const text = [

                    client.company_name,

                    client.slug,

                    client.domain,

                    client.hosting_type,

                    client.hosting_url,

                    client.template,

                    client.status

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return text.includes(
                    query
                );

            }
        );


    renderClients(
        filtered
    );

};


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================
   ESCAPE JAVASCRIPT
========================================================== */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    );

}
