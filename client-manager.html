<script>

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
|--------------------------------------------------------------------------
| GITHUB PAGES BASE PATH
|--------------------------------------------------------------------------
*/

const BASE_PATH = "/mdkaif/";


let allClients = [];
let allTemplates = [];
let editingClientId = null;


/*
|--------------------------------------------------------------------------
| MESSAGE
|--------------------------------------------------------------------------
*/

function showMessage(text,type="info"){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent = text;

    box.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        box.style.display = "none";

    },5000);
}


/*
|--------------------------------------------------------------------------
| INIT
|--------------------------------------------------------------------------
*/

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        setupSlugGenerator();

        await loadTemplates();

        await loadClients();

    }
);


/*
|--------------------------------------------------------------------------
| SLUG
|--------------------------------------------------------------------------
*/

function setupSlugGenerator(){

    const company =
        document.getElementById("companyName");

    const slug =
        document.getElementById("clientSlug");

    company.addEventListener(
        "input",
        function(){

            if(editingClientId) return;

            slug.value =
                makeSlug(company.value);

        }
    );

}


function makeSlug(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");

}


/*
|--------------------------------------------------------------------------
| TEMPLATE HELPERS
|--------------------------------------------------------------------------
*/

function getTemplateValue(row){

    return (
        row.template_slug ||
        row.slug ||
        row.template ||
        row.code ||
        row.template_code ||
        row.name ||
        row.template_name ||
        row.title ||
        ""
    );

}


function getTemplateDisplayName(row){

    return (
        row.template_name ||
        row.name ||
        row.title ||
        row.display_name ||
        row.template_slug ||
        row.slug ||
        row.template ||
        "Template"
    );

}


function findTemplateRow(value){

    const target =
        String(value || "")
        .trim()
        .toLowerCase();

    return allTemplates.find(
        row =>
            String(getTemplateValue(row))
            .trim()
            .toLowerCase()
            === target
    );

}


/*
|--------------------------------------------------------------------------
| LOAD TEMPLATES
|--------------------------------------------------------------------------
*/

async function loadTemplates(){

    const select =
        document.getElementById("templateSelect");

    select.innerHTML =
        `<option value="">Loading templates...</option>`;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("templates")
            .select("*")
            .order("created_at",{
                ascending:false
            });


    if(error){

        console.error(
            "Template Load Error:",
            error
        );

        select.innerHTML =
            `<option value="">Unable to load templates</option>`;

        showMessage(
            "Templates load nahi ho rahe: " +
            error.message,
            "error"
        );

        return;
    }


    allTemplates =
        data || [];


    document.getElementById(
        "totalTemplates"
    ).textContent =
        allTemplates.length;


    select.innerHTML =
        `<option value="">Select Template</option>`;


    allTemplates.forEach(
        template => {

            const value =
                getTemplateValue(template);

            if(!value) return;


            const name =
                getTemplateDisplayName(template);


            const option =
                document.createElement("option");

            option.value = value;

            option.textContent =
                name +
                " (" +
                value +
                ")";


            const status =
                String(
                    template.status || "active"
                ).toLowerCase();


            if(status !== "active"){

                option.disabled = true;

                option.textContent +=
                    " - Inactive";

            }


            select.appendChild(option);

        }
    );


    select.addEventListener(
        "change",
        updateTemplateInfo
    );

}


function updateTemplateInfo(){

    const value =
        document.getElementById(
            "templateSelect"
        ).value;


    const info =
        document.getElementById(
            "templateInfo"
        );


    if(!value){

        info.textContent = "";

        return;
    }


    const row =
        findTemplateRow(value);


    if(!row){

        info.textContent =
            "Template: " + value;

        return;
    }


    info.textContent =
        "Template folder: templates/" +
        value +
        "/index.html";

}


/*
|--------------------------------------------------------------------------
| LOAD CLIENTS
|--------------------------------------------------------------------------
*/

async function loadClients(){

    const container =
        document.getElementById(
            "clientsContainer"
        );


    container.innerHTML =
        `<div class="loading">
            Loading clients...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("clients")
            .select(`
                id,
                company_name,
                slug,
                domain,
                hosting_type,
                hosting_url,
                template,
                status,
                created_at
            `)
            .order("created_at",{
                ascending:false
            });


    if(error){

        console.error(
            "Client Load Error:",
            error
        );

        container.innerHTML =
            `<div class="empty">
                Unable to load clients.
            </div>`;


        showMessage(
            "Clients load nahi ho rahe: " +
            error.message,
            "error"
        );

        return;
    }


    allClients =
        data || [];


    updateStats();

    renderClients();

}


/*
|--------------------------------------------------------------------------
| STATS
|--------------------------------------------------------------------------
*/

function updateStats(){

    const total =
        allClients.length;


    const active =
        allClients.filter(
            c =>
                String(c.status || "")
                .toLowerCase()
                === "active"
        ).length;


    const inactive =
        total - active;


    document.getElementById(
        "totalClients"
    ).textContent =
        total;


    document.getElementById(
        "activeClients"
    ).textContent =
        active;


    document.getElementById(
        "inactiveClients"
    ).textContent =
        inactive;


    document.getElementById(
        "totalTemplates"
    ).textContent =
        allTemplates.length;

}


/*
|--------------------------------------------------------------------------
| RENDER CLIENTS
|--------------------------------------------------------------------------
*/

function renderClients(){

    const container =
        document.getElementById(
            "clientsContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    let clients =
        allClients.filter(
            client => {

                const text =
                    (
                        client.company_name || "" +
                        " " +
                        client.slug || "" +
                        " " +
                        client.domain || "" +
                        " " +
                        client.template || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                const clientStatus =
                    String(
                        client.status || "active"
                    ).toLowerCase();


                const matchesStatus =
                    statusFilter === "all" ||
                    clientStatus === statusFilter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    if(!clients.length){

        container.innerHTML =
            `<div class="empty">
                No clients found.
            </div>`;

        return;
    }


    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th>Company</th>
            <th>Slug</th>
            <th>Template</th>
            <th>Domain</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>
    `;


    clients.forEach(
        client => {

            const status =
                String(
                    client.status || "active"
                ).toLowerCase();


            const template =
                client.template || "-";


            const created =
                client.created_at
                    ? new Date(
                        client.created_at
                    ).toLocaleDateString()
                    : "-";


            html += `

            <tr>

                <td>
                    <strong>
                        ${escapeHtml(
                            client.company_name || "-"
                        )}
                    </strong>
                </td>


                <td>
                    ${escapeHtml(
                        client.slug || "-"
                    )}
                </td>


                <td>

                    <span class="badge badge-template">

                        ${escapeHtml(template)}

                    </span>

                </td>


                <td>

                    ${client.domain
                        ? escapeHtml(client.domain)
                        : "-"
                    }

                </td>


                <td>

                    <span class="badge ${
                        status === "active"
                        ? "badge-active"
                        : "badge-inactive"
                    }">

                        ${escapeHtml(status)}

                    </span>

                </td>


                <td>
                    ${created}
                </td>


                <td>

                    <div class="actions">

                        <button
                            class="btn-primary"
                            onclick="editClient('${client.id}')">
                            Edit
                        </button>


                        <button
                            class="btn-success"
                            onclick="previewTemplate('${client.id}')">
                            Preview
                        </button>


                        <button
                            class="btn-dark"
                            onclick="openWebsite('${client.id}')">
                            Website
                        </button>


                        <button
                            class="btn-danger"
                            onclick="deleteClient('${client.id}')">
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;

}


/*
|--------------------------------------------------------------------------
| SAVE CLIENT
|--------------------------------------------------------------------------
*/

async function saveClient(){

    const companyName =
        document.getElementById(
            "companyName"
        ).value.trim();


    const slug =
        document.getElementById(
            "clientSlug"
        ).value.trim();


    const domain =
        document.getElementById(
            "domain"
        ).value.trim();


    const hostingType =
        document.getElementById(
            "hostingType"
        ).value;


    const hostingUrl =
        document.getElementById(
            "hostingUrl"
        ).value.trim();


    const template =
        document.getElementById(
            "templateSelect"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value || "active";


    if(!companyName){

        showMessage(
            "Company Name required.",
            "error"
        );

        return;
    }


    if(!slug){

        showMessage(
            "Client Slug required.",
            "error"
        );

        return;
    }


    if(!template){

        showMessage(
            "Template select karo.",
            "error"
        );

        return;
    }


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    saveBtn.disabled = true;

    saveBtn.textContent =
        editingClientId
            ? "Updating..."
            : "Saving...";


    const payload = {

        company_name:
            companyName,

        slug:
            slug,

        domain:
            domain || null,

        hosting_type:
            hostingType || null,

        hosting_url:
            hostingUrl || null,

        template:
            template,

        status:
            status

    };


    let result;


    if(editingClientId){

        result =
            await supabaseClient
                .from("clients")
                .update(payload)
                .eq("id",editingClientId);

    }else{

        result =
            await supabaseClient
                .from("clients")
                .insert([payload]);

    }


    if(result.error){

        console.error(
            "Save Client Error:",
            result.error
        );


        showMessage(
            "Client save nahi hua: " +
            result.error.message,
            "error"
        );


        saveBtn.disabled = false;

        saveBtn.textContent =
            editingClientId
                ? "Update Client"
                : "Add Client";

        return;
    }


    showMessage(
        editingClientId
            ? "Client successfully updated."
            : "Client successfully added.",
        "success"
    );


    resetForm();

    await loadClients();

}


/*
|--------------------------------------------------------------------------
| EDIT CLIENT
|--------------------------------------------------------------------------
*/

window.editClient = function(id){

    const client =
        allClients.find(
            c => String(c.id) === String(id)
        );


    if(!client){

        showMessage(
            "Client not found.",
            "error"
        );

        return;
    }


    editingClientId =
        client.id;


    document.getElementById(
        "companyName"
    ).value =
        client.company_name || "";


    document.getElementById(
        "clientSlug"
    ).value =
        client.slug || "";


    document.getElementById(
        "domain"
    ).value =
        client.domain || "";


    document.getElementById(
        "hostingType"
    ).value =
        client.hosting_type || "";


    document.getElementById(
        "hostingUrl"
    ).value =
        client.hosting_url || "";


    document.getElementById(
        "templateSelect"
    ).value =
        client.template || "";


    document.getElementById(
        "status"
    ).value =
        client.status || "active";


    updateTemplateInfo();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Client";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Update Client";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/*
|--------------------------------------------------------------------------
| RESET
|--------------------------------------------------------------------------
*/

window.resetForm = function(){

    editingClientId = null;


    document.getElementById(
        "companyName"
    ).value = "";


    document.getElementById(
        "clientSlug"
    ).value = "";


    document.getElementById(
        "domain"
    ).value = "";


    document.getElementById(
        "hostingType"
    ).value = "";


    document.getElementById(
        "hostingUrl"
    ).value = "";


    document.getElementById(
        "templateSelect"
    ).value = "";


    document.getElementById(
        "status"
    ).value = "active";


    document.getElementById(
        "templateInfo"
    ).textContent = "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Client";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Add Client";

/*

| WEBSITE
|--------------------------------------------------------------------------
*/

window.openWebsite = function(id){

    const client =
        allClients.find(
            c => String(c.id) === String(id)
        );


    if(!client){

        showMessage(
            "Client not found.",
            "error"
        );

        return;
    }


    /*
     * If actual domain exists,
     * open actual domain.
     */

    let url =
        client.domain ||
        client.hosting_url ||
        "";


    if(url){

        url =
            String(url).trim();


        if(
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ){

            url =
                "https://" + url;

        }


        window.open(
            url,
            "_blank"
        );

        return;
    }


    /*
     * If no domain exists,
     * open GitHub Pages preview.
     */

    const previewUrl =
        BASE_PATH +
        "website.html?client=" +
        encodeURIComponent(id);


    window.open(
        previewUrl,
        "_blank"
    );

};

|--------------------------------------------------------------------------
*/

window.deleteClient = async function(id){

    const client =
        allClients.find(
            c => String(c.id) === String(id)
        );


    if(!client){

        showMessage(
            "Client not found.",
            "error"
        );

        return;
    }


    const confirmed =
        confirm(
            "Delete client \"" +
            (client.company_name || "") +
            "\"?"
        );


    if(!confirmed) return;


    const {
        error
    } =
        await supabaseClient
            .from("clients")
            .delete()
            .eq("id",id);


    if(error){

        console.error(
            "Delete Error:",
            error
        );


        showMessage(
            "Client delete nahi hua: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Client successfully deleted.",
        "success"
    );


    if(
        String(editingClientId) ===
        String(id)
    ){

        resetForm();

    }


    await loadClients();

};

/*

| HTML ESCAPE
|--------------------------------------------------------------------------
*/

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
