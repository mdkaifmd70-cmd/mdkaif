<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let allClients = [];

let allTemplates = [];

let editingClientId = null;


/* =========================================
   PATH
========================================= */

function pageUrl(
    file,
    query = ""
){

    return new URL(
        file + query,
        window.location.href
    ).href;

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   AUTH
========================================= */

async function checkAuth(){

    const {
        data
    } = await supabaseClient
        .auth
        .getUser();


    if(!data?.user){

        window.location.href =
            pageUrl("admin.html");

        return false;

    }


    return true;

}


/* =========================================
   TEMPLATE VALUE
========================================= */

function getTemplateValue(row){

    return String(
        row.template_slug ||
        row.slug ||
        row.template ||
        row.code ||
        row.template_code ||
        row.name ||
        row.template_name ||
        row.title ||
        ""
    )
    .trim()
    .toLowerCase();

}


/* =========================================
   TEMPLATE NAME
========================================= */

function getTemplateDisplayName(row){

    return (
        row.template_name ||
        row.name ||
        row.title ||
        row.display_name ||
        row.template_slug ||
        row.slug ||
        row.template ||
        "Template"
    );

}


/* =========================================
   TEMPLATE URL
========================================= */

function getTemplateUrl(row){

    const slug =
        getTemplateValue(row);


    const dbUrl =
        String(
            row.template_url || ""
        ).trim();


    if(dbUrl){

        return dbUrl;

    }


    return `templates/${slug}.html`;

}


/* =========================================
   LOAD TEMPLATES
========================================= */

async function loadTemplates(){

    const {
        data,
        error
    } = await supabaseClient
        .from("templates")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Template load error:",
            error
        );

        alert(
            "Template loading failed: " +
            error.message
        );

        return;

    }


    allTemplates =
        data || [];


    populateTemplateSelect();

}


/* =========================================
   POPULATE TEMPLATE SELECT
========================================= */

function populateTemplateSelect(){

    const select =
        document.getElementById(
            "templateSelect"
        );


    if(!select){

        return;

    }


    select.innerHTML = `
        <option value="">
            Select Template
        </option>
    `;


    allTemplates.forEach(
        template => {

            const slug =
                getTemplateValue(
                    template
                );


            if(!slug){

                return;

            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                slug;


            option.textContent =
                getTemplateDisplayName(
                    template
                );


            const status =
                String(
                    template.status ||
                    "active"
                ).toLowerCase();


            if(status !== "active"){

                option.disabled =
                    true;

                option.textContent +=
                    " (Inactive)";

            }


            select.appendChild(
                option
            );

        }
    );


    updateTemplateInfo();

}


/* =========================================
   TEMPLATE INFO
========================================= */

function updateTemplateInfo(){

    const select =
        document.getElementById(
            "templateSelect"
        );

    const info =
        document.getElementById(
            "templateInfo"
        );


    if(!select || !info){

        return;

    }


    const slug =
        select.value;


    if(!slug){

        info.innerHTML =
            "Select a template.";

        return;

    }


    const row =
        allTemplates.find(
            template =>
                getTemplateValue(
                    template
                ) === slug
        );


    const url =
        row
            ? getTemplateUrl(row)
            : `templates/${slug}.html`;


    info.innerHTML =
        `Template file:
        <code>${escapeHtml(url)}</code>`;

}


/* =========================================
   LOAD CLIENTS
========================================= */

async function loadClients(){

    const {
        data,
        error
    } = await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Client load error:",
            error
        );

        alert(
            "Clients loading failed: " +
            error.message
        );

        return;

    }


    allClients =
        data || [];


    renderClients();

    updateClientStats();

}


/* =========================================
   RENDER CLIENTS
========================================= */

function renderClients(){

    const tbody =
        document.getElementById(
            "clientTableBody"
        );


    if(!tbody){

        return;

    }


    if(!allClients.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="10"
                    style="text-align:center;padding:30px;">
                    No clients found.
                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        allClients.map(
            client => {

                const status =
                    String(
                        client.status ||
                        "active"
                    ).toLowerCase();


                return `
                    <tr>

                        <td>
                            <strong>
                                ${escapeHtml(
                                    client.company_name
                                )}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(
                                client.slug
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                client.domain ||
                                "-"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                client.hosting_type ||
                                "-"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                client.template ||
                                "-"
                            )}
                        </td>

                        <td>
                            ${status === "active"
                                ? "Active"
                                : "Inactive"}
                        </td>

                        <td>

                            <button
                                type="button"
                                onclick="editClient('${client.id}')">
                                Edit
                            </button>

                            <button
                                type="button"
                                onclick="previewClient('${client.id}')">
                                Preview
                            </button>

                            <button
                                type="button"
                                onclick="openClientWebsite('${client.id}')">
                                Website
                            </button>

                            <button
                                type="button"
                                onclick="deleteClient('${client.id}')">
                                Delete
                            </button>

                        </td>

                    </tr>
                `;

            }
        ).join("");

}


/* =========================================
   STATS
========================================= */

function updateClientStats(){

    const total =
        document.getElementById(
            "totalClients"
        );

    const active =
        document.getElementById(
            "activeClients"
        );


    if(total){

        total.textContent =
            allClients.length;

    }


    if(active){

        active.textContent =
            allClients.filter(
                client =>
                    String(
                        client.status ||
                        "active"
                    ).toLowerCase()
                    === "active"
            ).length;

    }

}


/* =========================================
   SLUG
========================================= */

function setupSlugGenerator(){

    const company =
        document.getElementById(
            "companyName"
        );

    const slug =
        document.getElementById(
            "clientSlug"
        );


    if(!company || !slug){

        return;

    }


    company.addEventListener(
        "input",
        function(){

            if(
                editingClientId
            ){

                return;

            }


            slug.value =
                this.value
                    .toLowerCase()
                    .trim()
                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )
                    .replace(
                        /^-+|-+$/g,
                        ""
                    );

        }
    );

}


/* =========================================
   SAVE CLIENT
========================================= */

async function saveClient(){

    const companyName =
        document.getElementById(
            "companyName"
        ).value.trim();


    const slug =
        document.getElementById(
            "clientSlug"
        ).value
            .trim()
            .toLowerCase();


    const domain =
        document.getElementById(
            "domain"
        ).value.trim();


    const hostingType =
        document.getElementById(
            "hostingType"
        ).value.trim();


    const hostingUrl =
        document.getElementById(
            "hostingUrl"
        ).value.trim();


    const template =
        document.getElementById(
            "templateSelect"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value;


    if(!companyName){

        alert(
            "Company Name is required."
        );

        return;

    }


    if(!slug){

        alert(
            "Client Slug is required."
        );

        return;

    }


    if(!template){

        alert(
            "Please select a template."
        );

        return;

    }


    const payload = {

        company_name:
            companyName,

        slug:
            slug,

        domain:
            domain || null,

        hosting_type:
            hostingType || null,

        hosting_url:
            hostingUrl || null,

        /*
            IMPORTANT

            Stores:

            template-v1
            template-v2
            ...
        */

        template:
            template,

        status:
            status || "active"

    };


    let result;


    if(editingClientId){

        result =
            await supabaseClient
                .from("clients")
                .update(payload)
                .eq(
                    "id",
                    editingClientId
                );

    }
    else{

        result =
            await supabaseClient
                .from("clients")
                .insert(payload);

    }


    if(result.error){

        console.error(
            result.error
        );

        alert(
            "Client save failed: " +
            result.error.message
        );

        return;

    }


    alert(
        editingClientId
            ? "Client updated successfully."
            : "Client created successfully."
    );


    editingClientId =
        null;


    resetClientForm();


    await loadClients();

}


/* =========================================
   EDIT CLIENT
========================================= */

function editClient(id){

    const client =
        allClients.find(
            item =>
                String(item.id)
                === String(id)
        );


    if(!client){

        return;

    }


    editingClientId =
        client.id;


    document.getElementById(
        "companyName"
    ).value =
        client.company_name || "";


    document.getElementById(
        "clientSlug"
    ).value =
        client.slug || "";


    document.getElementById(
        "domain"
    ).value =
        client.domain || "";


    document.getElementById(
        "hostingType"
    ).value =
        client.hosting_type || "";


    document.getElementById(
        "hostingUrl"
    ).value =
        client.hosting_url || "";


    const templateSelect =
        document.getElementById(
            "templateSelect"
        );


    if(templateSelect){

        templateSelect.value =
            String(
                client.template || ""
            )
            .trim()
            .toLowerCase();

    }


    document.getElementById(
        "status"
    ).value =
        client.status || "active";


    updateTemplateInfo();


    const title =
        document.getElementById(
            "formTitle"
        );


    if(title){

        title.textContent =
            "Edit Client";

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   RESET
========================================= */

function resetClientForm(){

    const form =
        document.getElementById(
            "clientForm"
        );


    if(form){

        form.reset();

    }


    editingClientId =
        null;


    const title =
        document.getElementById(
            "formTitle"
        );


    if(title){

        title.textContent =
            "Add Client";

    }


    updateTemplateInfo();

}


/* =========================================
   PREVIEW CLIENT
========================================= */

function previewClient(id){

    const client =
        allClients.find(
            item =>
                String(item.id)
                === String(id)
        );


    if(!client){

        alert(
            "Client not found."
        );

        return;

    }


    if(
        String(
            client.status || ""
        ).toLowerCase()
        !== "active"
    ){

        alert(
            "This client is inactive."
        );

        return;

    }


    /*
        Save active client
        into client-context.js
    */

    if(
        window.MDKClientContext
    ){

        window.MDKClientContext.set(
            client
        );

    }


    /*
        IMPORTANT

        No /mdkaif/

        Current GitHub path
        automatically detected.
    */

    const previewUrl =
        pageUrl(
            "website.html",
            `?client=${encodeURIComponent(
                client.id
            )}&preview=1`
        );


    window.open(
        previewUrl,
        "_blank",
        "noopener"
    );

}


/* =========================================
   OPEN LIVE WEBSITE
========================================= */

function openClientWebsite(id){

    const client =
        allClients.find(
            item =>
                String(item.id)
                === String(id)
        );


    if(!client){

        return;

    }


    /*
        Set active client
    */

    if(
        window.MDKClientContext
    ){

        window.MDKClientContext.set(
            client
        );

    }


    let target =
        client.domain ||
        client.hosting_url ||
        "";


    target =
        String(
            target
        ).trim();


    /*
        If external website exists
        open external website.
    */

    if(target){

        if(
            !/^https?:\/\//i.test(
                target
            )
        ){

            target =
                "https://" +
                target;

        }


        window.open(
            target,
            "_blank",
            "noopener"
        );


        return;

    }


    /*
        No external domain:
        open platform preview.
    */

    const previewUrl =
        pageUrl(
            "website.html",
            `?client=${encodeURIComponent(
                client.id
            )}&preview=1`
        );


    window.open(
        previewUrl,
        "_blank",
        "noopener"
    );

}


/* =========================================
   DELETE CLIENT
========================================= */

async function deleteClient(id){

    const client =
        allClients.find(
            item =>
                String(item.id)
                === String(id)
        );


    if(!client){

        return;

    }


    if(
        !confirm(
            `Delete client "${client.company_name}"?`
        )
    ){

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("clients")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    await loadClients();

}


/* =========================================
   SEARCH
========================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


if(searchInput){

    searchInput.addEventListener(
        "input",
        function(){

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            const rows =
                document.querySelectorAll(
                    "#clientTableBody tr"
                );


            allClients.forEach(
                (client,index) => {

                    const text = [

                        client.company_name,

                        client.slug,

                        client.domain,

                        client.template

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    if(rows[index]){

                        rows[index].style.display =
                            text.includes(search)
                                ? ""
                                : "none";

                    }

                }
            );

        }
    );

}


/* =========================================
   TEMPLATE CHANGE
========================================= */

const templateSelect =
    document.getElementById(
        "templateSelect"
    );


if(templateSelect){

    templateSelect.addEventListener(
        "change",
        updateTemplateInfo
    );

}


/* =========================================
   INIT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const authenticated =
            await checkAuth();


        if(!authenticated){

            return;

        }


        setupSlugGenerator();

        await loadTemplates();

        await loadClients();

    }
);


/* =========================================
   GLOBAL FUNCTIONS
========================================= */

window.saveClient =
    saveClient;

window.editClient =
    editClient;

window.deleteClient =
    deleteClient;

window.previewClient =
    previewClient;

window.openClientWebsite =
    openClientWebsite;

window.resetClientForm =
    resetClientForm;

window.loadClients =
    loadClients;

window.loadTemplates =
    loadTemplates;

</script>
