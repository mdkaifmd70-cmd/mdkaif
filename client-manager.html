<style>

}

body{

.header{

.back-btn,

}

}

}

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true,
                storage:window.localStorage
            }
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const formCard =
    document.getElementById("formCard");

const clientForm =
    document.getElementById("clientForm");

const clientId =
    document.getElementById("clientId");

const companyName =
    document.getElementById("companyName");

const slug =
    document.getElementById("slug");

const domain =
    document.getElementById("domain");

const hostingType =
    document.getElementById("hostingType");

const hostingUrl =
    document.getElementById("hostingUrl");

const template =
    document.getElementById("template");

const templateStatus =
    document.getElementById("templateStatus");

const status =
    document.getElementById("status");

const saveBtn =
    document.getElementById("saveBtn");

const clientTable =
    document.getElementById("clientTable");

const tableArea =
    document.getElementById("tableArea");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const message =
    document.getElementById("message");

const formTitle =
    document.getElementById("formTitle");

const activeClientName =
    document.getElementById("activeClientName");


/* =====================================================
   FALLBACK TEMPLATES
   IMPORTANT:
   GitHub files are:
   template/template-v1.html
   ...
   template/template-v10.html
===================================================== */

const FALLBACK_TEMPLATES = [
    "template-v1",
    "template-v2",
    "template-v3",
    "template-v4",
    "template-v5",
    "template-v6",
    "template-v7",
    "template-v8",
    "template-v9",
    "template-v10"
];

let templatesData = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(function(){

        message.className =
            "message";

    },4000);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   NORMALIZE TEMPLATE
===================================================== */

function normalizeTemplateSlug(value){

    let slugValue =
        String(value || "")
        .trim()
        .toLowerCase();

    if(!slugValue){
        return "";
    }

    slugValue =
        slugValue
        .replace(/^https?:\/\/[^/]+\//,"")
        .replace(/^templates\//,"")
        .replace(/^template\//,"")
        .replace(/\.html$/i,"")
        .trim();

    /*
       Old database values also supported:

       v1
       template-v1
       template/template-v1.html
       templates/template-v1.html
    */

    if(/^v\d+$/.test(slugValue)){

        slugValue =
            "template-" + slugValue;

    }

    return slugValue;

}


/* =====================================================
   TEMPLATE URL
   ONLY SINGULAR template/
===================================================== */

function getTemplateUrl(value){

    const slugValue =
        normalizeTemplateSlug(value);

    if(!slugValue){
        return "";
    }

    return new URL(
        "template/" +
        slugValue +
        ".html",
        window.location.href
    ).href;

}


/* =====================================================
   LOAD TEMPLATES
===================================================== */

async function loadTemplates(){

    templatesData = [];

    /*
       First try Supabase templates table.
    */

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("templates")
            .select("*");

        if(!error && Array.isArray(data)){

            data.forEach(function(row){

                const value =
                    normalizeTemplateSlug(
                        row.slug ||
                        row.template_slug ||
                        row.template ||
                        row.template_name ||
                        row.name ||
                        row.code ||
                        row.template_code
                    );

                if(value){

                    templatesData.push({

                        value:value,

                        label:
                            row.name ||
                            row.template_name ||
                            row.title ||
                            value

                    });

                }

            });

        }

    }
    catch(error){

        console.error(
            "Template table error:",
            error
        );

    }


    /*
       Remove duplicates.
    */

    const map = new Map();

    templatesData.forEach(function(item){

        map.set(
            item.value,
            item
        );

    });


    templatesData =
        Array.from(map.values());


    /*
       If Supabase template table is empty,
       use the actual GitHub template files.
    */

    if(templatesData.length === 0){

        templatesData =
            FALLBACK_TEMPLATES.map(function(value){

                return {

                    value:value,

                    label:
                        value.toUpperCase()

                };

            });

        templateStatus.textContent =
            "Using GitHub templates v1-v10.";

    }
    else{

        templateStatus.textContent =
            templatesData.length +
            " template(s) loaded.";

    }


    templateStatus.className =
        "template-status ok";


    template.innerHTML = `
        <option value="">
            Select Website Template
        </option>
    `;


    templatesData.forEach(function(item){

        const option =
            document.createElement("option");

        option.value =
            item.value;

        option.textContent =
            item.label;

        template.appendChild(option);

    });

}


/* =====================================================
   LOGIN
===================================================== */

async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();

    if(error){

        console.error(error);

        return false;

    }

    if(!data.user){

        window.location.href =
            "admin.html";

        return false;

    }

    return true;

}


/* =====================================================
   ACTIVE CLIENT
===================================================== */

function updateActiveClientDisplay(){

    if(
        window.MDKClientContext
    ){

        const client =
            MDKClientContext.get();

        if(client){

            activeClientName.textContent =
                client.company_name ||
                client.id;

            return;

        }

    }

    activeClientName.textContent =
        "None";

}


/* =====================================================
   ADD CLIENT
===================================================== */

document
.getElementById("addBtn")
.addEventListener("click",function(){

    clientForm.reset();

    clientId.value = "";

    hostingType.value =
        "GitHub Pages";

    status.value =
        "active";

    formTitle.textContent =
        "Add New Client";

    saveBtn.textContent =
        "Save Client";

    formCard.classList.remove("hidden");

    companyName.focus();

});


/* =====================================================
   CANCEL
===================================================== */

document
.getElementById("cancelBtn")
.addEventListener("click",function(){

    formCard.classList.add("hidden");

});


/* =====================================================
   AUTO SLUG
===================================================== */

companyName.addEventListener(
    "input",
    function(){

        if(!clientId.value){

            slug.value =
                companyName.value
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9]+/g,"-")
                    .replace(/^-+|-+$/g,"");

        }

    }
);


/* =====================================================
   SAVE CLIENT
===================================================== */

clientForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const company =
            companyName.value.trim();

        const slugValue =
            slug.value.trim();

        const domainValue =
            domain.value.trim();

        const hostingTypeValue =
            hostingType.value;

        const hostingUrlValue =
            hostingUrl.value.trim();

        /*
           IMPORTANT:
           Always store normalized value:
           template-v1
           template-v2
           ...
        */

        const templateValue =
            normalizeTemplateSlug(
                template.value
            );

        const statusValue =
            status.value;


        if(!company){

            showMessage(
                "Company name is required.",
                "error"
            );

            return;

        }


        if(!slugValue){

            showMessage(
                "Slug is required.",
                "error"
            );

            return;

        }


        if(!templateValue){

            showMessage(
                "Please select a website template.",
                "error"
            );

            return;

        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            "Saving...";


        let result;


        const payload = {

            company_name:
                company,

            slug:
                slugValue,

            domain:
                domainValue || null,

            hosting_type:
                hostingTypeValue || null,

            hosting_url:
                hostingUrlValue || null,

            template:
                templateValue,

            status:
                statusValue

        };


        if(clientId.value){

            result =
                await supabaseClient
                    .from("clients")
                    .update({
                        ...payload,
                        updated_at:
                            new Date().toISOString()
                    })
                    .eq(
                        "id",
                        clientId.value
                    );

        }
        else{

            result =
                await supabaseClient
                    .from("clients")
                    .insert(payload);

        }


        saveBtn.disabled = false;


        if(result.error){

            console.error(
                result.error
            );

            showMessage(
                result.error.message,
                "error"
            );

            saveBtn.textContent =
                clientId.value
                ? "Update Client"
                : "Save Client";

            return;

        }


        const savedId =
            clientId.value;


        showMessage(
            savedId
            ? "Client updated successfully."
            : "Client created successfully.",
            "success"
        );


        formCard.classList.add("hidden");


        clientForm.reset();

        clientId.value = "";


        saveBtn.textContent =
            "Save Client";


        /*
           Automatically make saved client active.
        */

        let targetId =
            savedId;


        if(!targetId){

            const {
                data
            } =
            await supabaseClient
                .from("clients")
                .select("id")
                .eq(
                    "slug",
                    slugValue
                )
                .maybeSingle();

            targetId =
                data
                ? data.id
                : null;

        }


        if(targetId){

            await useClient(
                targetId,
                false
            );

        }


        await loadClients();

    }
);


/* =====================================================
   LOAD CLIENTS
===================================================== */

async function loadClients(){

    loading.classList.remove("hidden");

    tableArea.classList.add("hidden");

    empty.classList.add("hidden");


    const {
        data,
        error
    } =
    await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    loading.classList.add("hidden");


    if(error){

        console.error(error);

        showMessage(
            "Unable to load clients: " +
            error.message,
            "error"
        );

        return;

    }


    if(!data || data.length === 0){

        empty.classList.remove("hidden");

        return;

    }


    clientTable.innerHTML = "";


    const activeId =
        window.MDKClientContext
        ? MDKClientContext.id()
        : null;


    data.forEach(function(client){

        const row =
            document.createElement("tr");


        const templateSlug =
            normalizeTemplateSlug(
                client.template
            );


        const templateUrl =
            getTemplateUrl(
                templateSlug
            );


        const websiteUrl =
            client.domain
            ? buildExternalUrl(
                client.domain
            )
            : (
                client.hosting_url
                ? buildExternalUrl(
                    client.hosting_url
                )
                : ""
            );


        row.innerHTML = `

            <td>

                <div class="company">

                    ${escapeHtml(
                        client.company_name
                    )}

                </div>

            </td>


            <td>

                <span class="slug">

                    ${escapeHtml(
                        client.slug
                    )}

                </span>

            </td>


            <td>

                <span class="domain">

                    ${escapeHtml(
                        client.domain || "—"
                    )}

                </span>

            </td>


            <td>

                <div class="hosting">

                    ${escapeHtml(
                        client.hosting_type || "—"
                    )}

                </div>

            </td>


            <td>

                <span class="template-badge">

                    ${escapeHtml(
                        templateSlug || "—"
                    )}

                </span>

            </td>


            <td>

                <span class="badge ${
                    client.status === "active"
                    ? "active"
                    : "inactive"
                }">

                    ${escapeHtml(
                        client.status || "active"
                    )}

                </span>

            </td>


            <td>

                <div class="actions">


                    <button
                        class="preview-btn"
                        onclick="previewClient('${client.id}')"
                        ${templateUrl ? "" : "disabled"}
                    >

                        👁 Preview

                    </button>


                    <button
                        class="website-btn"
                        onclick="openClientWebsite('${client.id}')"
                    >

                        🌐 Website

                    </button>


                    <button
                        class="use-btn"
                        onclick="useClient('${client.id}')"
                    >

                        ${
                            activeId === client.id
                            ? "✓ Active"
                            : "Use Client"
                        }

                    </button>


                    <button
                        class="edit-btn"
                        onclick="editClient('${client.id}')"
                    >

                        Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteClient('${client.id}')"
                    >

                        Delete

                    </button>


                </div>

            </td>

        `;


        clientTable.appendChild(row);

    });


    tableArea.classList.remove("hidden");

    updateActiveClientDisplay();

}


/* =====================================================
   EXTERNAL URL
===================================================== */

function buildExternalUrl(value){

    if(!value){
        return "";
    }

    let url =
        String(value).trim();

    if(!url){
        return "";
    }

    if(
        !/^https?:\/\//i.test(url)
    ){

        url =
            "https://" + url;

    }

    try{

        return new URL(url).href;

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   USE CLIENT
===================================================== */

window.useClient =
async function(
    id,
    showAlert = true
){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status
        `)
        .eq(
            "id",
            id
        )
        .single();


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    /*
       Normalize template before saving
       to local context.
    */

    data.template =
        normalizeTemplateSlug(
            data.template
        );


    if(
        window.MDKClientContext
    ){

        MDKClientContext.set(data);

    }


    updateActiveClientDisplay();


    if(showAlert){

        showMessage(
            data.company_name +
            " is now the active client.",
            "success"
        );

    }


    await loadClients();

};


/* =====================================================
   PREVIEW CLIENT
===================================================== */

window.previewClient =
async function(id){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status
        `)
        .eq(
            "id",
            id
        )
        .single();


    if(error || !data){

        console.error(error);

        showMessage(
            "Unable to find client.",
            "error"
        );

        return;

    }


    const templateSlug =
        normalizeTemplateSlug(
            data.template
        );


    if(!templateSlug){

        showMessage(
            "No template assigned to this client.",
            "error"
        );

        return;

    }


    /*
       Make client active before preview.
    */

    if(
        window.MDKClientContext
    ){

        MDKClientContext.set({
            ...data,
            template:templateSlug
        });

    }


    /*
       EXACT PATH:

       template/template-v1.html

       NOT:

       templates/template-v1.html

       NOT:

       industria.html
    */

    const baseUrl =
        getTemplateUrl(
            templateSlug
        );


    if(!baseUrl){

        showMessage(
            "Template URL could not be created.",
            "error"
        );

        return;

    }


    const url =
        new URL(baseUrl);


    url.searchParams.set(
        "client",
        data.id
    );


    url.searchParams.set(
        "preview",
        "1"
    );


    console.log(
        "CLIENT PREVIEW URL:",
        url.href
    );


    window.open(
        url.href,
        "_blank",
        "noopener,noreferrer"
    );

};


/* =====================================================
   OPEN ACTUAL CLIENT WEBSITE
===================================================== */

window.openClientWebsite =
async function(id){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            domain,
            hosting_url,
            template
        `)
        .eq(
            "id",
            id
        )
        .single();


    if(error || !data){

        showMessage(
            "Unable to find client website.",
            "error"
        );

        return;

    }


    /*
       Priority:

       1. Domain
       2. Hosting URL
       3. Template preview
    */

    let url =
        data.domain
        ? buildExternalUrl(data.domain)
        : buildExternalUrl(data.hosting_url);


    if(url){

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

        return;

    }


    /*
       If client has no external URL,
       open our template preview instead.
    */

    const templateSlug =
        normalizeTemplateSlug(
            data.template
        );


    if(!templateSlug){

        showMessage(
            "No domain, hosting URL or template found.",
            "error"
        );

        return;

    }


    const previewUrl =
        new URL(
            getTemplateUrl(
                templateSlug
            )
        );


    previewUrl.searchParams.set(
        "client",
        data.id
    );


    previewUrl.searchParams.set(
        "preview",
        "1"
    );


    window.open(
        previewUrl.href,
        "_blank",
        "noopener,noreferrer"
    );

};


/* =====================================================
   EDIT CLIENT
===================================================== */

window.editClient =
async function(id){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("clients")
        .select(`
            id,
            company_name,
            slug,
            domain,
            hosting_type,
            hosting_url,
            template,
            status
        `)
        .eq(
            "id",
            id
        )
        .single();


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    clientId.value =
        data.id;

    companyName.value =
        data.company_name || "";

    slug.value =
        data.slug || "";

    domain.value =
        data.domain || "";

    hostingType.value =
        data.hosting_type ||
        "GitHub Pages";

    hostingUrl.value =
        data.hosting_url || "";

    template.value =
        normalizeTemplateSlug(
            data.template
        );

    status.value =
        data.status ||
        "active";


    /*
       If old template value isn't
       in dropdown, create option.
    */

    if(
        data.template &&
        !Array.from(
            template.options
        ).some(
            option =>
                option.value ===
                normalizeTemplateSlug(
                    data.template
                )
        )
    ){

        const value =
            normalizeTemplateSlug(
                data.template
            );

        if(value){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                value;

            option.textContent =
                value + " (Existing)";

            template.appendChild(
                option
            );

            template.value =
                value;

        }

    }


    formTitle.textContent =
        "Edit Client";

    saveBtn.textContent =
        "Update Client";


    formCard.classList.remove(
        "hidden"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =====================================================
   DELETE CLIENT
===================================================== */

window.deleteClient =
async function(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this client?"
        );


    if(!confirmed){
        return;
    }


    const activeId =
        window.MDKClientContext
        ? MDKClientContext.id()
        : null;


    const {
        error
    } =
    await supabaseClient
        .from("clients")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    if(
        activeId === id &&
        window.MDKClientContext
    ){

        MDKClientContext.clear();

    }


    showMessage(
        "Client deleted successfully.",
        "success"
    );


    updateActiveClientDisplay();

    await loadClients();

};
