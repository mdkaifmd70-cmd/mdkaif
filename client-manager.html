<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MD Kaif Web Platform — Client Manager</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --border:#e5e7eb;
    --danger:#dc2626;
    --success:#16a34a;
    --warning:#d97706;
    --sidebar:#111827;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:18px;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-info{
    font-size:13px;
    color:var(--muted);
    margin-right:8px;
}

/* =========================================================
   LAYOUT
========================================================= */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:250px;
    background:var(--sidebar);
    color:#fff;
    padding:18px 12px;
    flex-shrink:0;
}

.sidebar-title{
    font-size:11px;
    color:#9ca3af;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:10px 12px 7px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px 13px;
    margin:3px 0;
    border-radius:9px;
    color:#d1d5db;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.nav-item:hover,
.nav-item.active{
    background:#1f2937;
    color:#fff;
}

.nav-icon{
    width:20px;
    text-align:center;
}

.main{
    flex:1;
    padding:24px;
    min-width:0;
}

.page-title{
    font-size:25px;
    font-weight:800;
    margin-bottom:5px;
}

    font-size:14px;
