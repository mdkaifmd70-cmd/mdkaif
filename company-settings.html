<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Company Settings | MD Kaif Web Platform</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#1f2937;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.header{
    background:#111827;
    color:white;
    padding:22px 25px;
    border-radius:14px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 6px;
    font-size:25px;
}

.header p{
    margin:0;
    opacity:.8;
}

.client-box{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.client-box label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
}

.client-box select{
    width:100%;
    max-width:500px;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

.current-client{
    margin-top:10px;
    font-size:14px;
    color:#2563eb;
    font-weight:600;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card h2{
    margin:0 0 20px;
    font-size:19px;
    border-bottom:1px solid #e5e7eb;
    padding-bottom:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#2563eb;
}

.field textarea{
    min-height:110px;
    resize:vertical;
}

.color-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.color-row input[type="color"]{
    width:55px;
    height:42px;
    padding:2px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

button{
    border:none;
    padding:13px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
}

.save-btn{
    background:#2563eb;
    color:white;
}

.save-btn:hover{
    background:#1d4ed8;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px 16px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.hidden{
    display:none!important;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .container{
        padding:0 12px;
        margin:15px auto;
    }

    .card{
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Company Settings</h1>

        <p>
            Manage branding, contact details, company profile,
            SEO, social links and website colors.
        </p>

    </div>


    <!-- CLIENT SELECTOR -->

    <div
        id="clientBox"
        class="client-box hidden"
    >

        <label for="clientSelect">
            Select Client
        </label>

        <select
            id="clientSelect"
            onchange="handleClientChange()"
        >

            <option value="">
                -- Select Client --
            </option>

        </select>

        <div
            id="currentClient"
            class="current-client"
        ></div>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <form
        id="settingsForm"
        onsubmit="saveSettings(event)"
    >


        <!-- BRANDING -->

        <div class="card">

            <h2>Branding</h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Logo URL
                    </label>

                    <input
                        type="url"
                        id="logoUrl"
                        placeholder="https://..."
                    >

                </div>


                <div class="field">

                    <label>
                        Favicon URL
                    </label>

                    <input
                        type="url"
                        id="faviconUrl"
                        placeholder="https://..."
                    >

                </div>


                <div class="field full">

                    <label>
                        Tagline
                    </label>

                    <input
                        type="text"
                        id="tagline"
                        placeholder="Your company tagline"
                    >

                </div>

            </div>

        </div>



        <!-- CONTACT -->

        <div class="card">

            <h2>Contact Information</h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="+91..."
                    >

                </div>


                <div class="field">

                    <label>
                        WhatsApp
                    </label>

                    <input
                        type="text"
                        id="whatsapp"
                        placeholder="+91..."
                    >

                </div>


                <div class="field">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="info@example.com"
                    >

                </div>


                <div class="field">

                    <label>
                        Website
                    </label>

                    <input
                        type="url"
                        id="website"
                        placeholder="https://example.com"
                    >

                </div>


                <div class="field full">

                    <label>
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Full business address"
                    ></textarea>

                </div>


                <div class="field">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                    >

                </div>


                <div class="field">

                    <label>
                        State
                    </label>

                    <input
                        type="text"
                        id="state"
                    >

                </div>


                <div class="field">

                    <label>
                        Country
                    </label>

                    <input
                        type="text"
                        id="country"
                    >

                </div>


                <div class="field">

                    <label>
                        Postal Code
                    </label>

                    <input
                        type="text"
                        id="postalCode"
                    >

                </div>

            </div>

        </div>



        <!-- COMPANY PROFILE -->

        <div class="card">

            <h2>Company Profile</h2>

            <div class="grid">

                <div class="field full">

                    <label>
                        About Company
                    </label>

                    <textarea
                        id="about"
                        placeholder="About your company..."
                    ></textarea>

                </div>


                <div class="field full">

                    <label>
                        Mission
                    </label>

                    <textarea
                        id="mission"
                        placeholder="Company mission..."
                    ></textarea>

                </div>


                <div class="field full">

                    <label>
                        Vision
                    </label>

                    <textarea
                        id="vision"
                        placeholder="Company vision..."
                    ></textarea>

                </div>

            </div>

        </div>



        <!-- SEO -->

        <div class="card">

            <h2>SEO Settings</h2>

            <div class="grid">

                <div class="field full">

                    <label>
                        Website Title
                    </label>

                    <input
                        type="text"
                        id="websiteTitle"
                        placeholder="Company Name | Manufacturing"
                    >

                </div>


                <div class="field full">

                    <label>
                        Meta Description
                    </label>

                    <textarea
                        id="metaDescription"

                    ></textarea>

                </div>

            </div>

        </div>



        <!-- SOCIAL -->

        <div class="card">

            <h2>Social Media</h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Facebook URL

                    <input
                        type="url"
                        id="facebookUrl"
                        placeholder="https://facebook.com/..."
                    >

                </div>


                <div class="field">

                    <label>
                        Instagram URL
                    </label>

                    <input
                        type="url"
                        id="instagramUrl"
                        placeholder="https://instagram.com/..."
                    >

                </div>


                <div class="field">

                    <label>
                        LinkedIn URL
                    </label>

                    <input
                        type="url"
                        id="linkedinUrl"
                        placeholder="https://linkedin.com/..."
                    >

                </div>


                <div class="field">

                    <label>
                        YouTube URL
                    </label>

                    <input
                        type="url"
                        id="youtubeUrl"
                        placeholder="https://youtube.com/..."
                    >

                </div>

            </div>

        </div>



        <!-- COLORS -->

        <div class="card">

            <h2>Website Colors</h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Primary Color

                        <input

                            value="#2563eb"
                        >

                        <input
                            type="text"
                            id="primaryColorText"
                            value="#2563eb"
                            placeholder="#2563eb"
                        >

                    </div>

                </div>


                <div class="field">

                    <label>
                        Secondary Color
                    </label>

                    <div class="color-row">

                        <input
                            type="color"
                            id="secondaryColor"
                            value="#111827"
                        >

                        <input
                            type="text"
                            id="secondaryColorText"
                            value="#111827"
                            placeholder="#111827"
                        >

                    </div>

                </div>

            </div>

        </div>



        <!-- SAVE -->

        <div class="actions">

            <button
                type="submit"
                id="saveBtn"
                class="save-btn"
            >
                Save Company Settings
            </button>

        </div>

    </form>

</div>



<script src="../client-context.js"></script>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentClientId = null;

let currentClient = null;

let currentSettings = null;

let clients = [];



/* =========================================================
   DOM HELPERS
========================================================= */

function $(id){

    return document.getElementById(id);

}


function cleanValue(id){

    const el = $(id);

    if(!el){
        return null;
    }

    const value =
        String(el.value || '').trim();

    return value || null;

}



function validColor(value){

    return /^#[0-9A-Fa-f]{6}$/.test(
        value || ''
    );

}



/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = 'success'
){

    const message =
        $('message');

    message.textContent =
        text;

    message.className =
        'message ' + type;

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });


    setTimeout(function(){

        message.className =
            'message';

    },5000);

}



/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if(!user){

            showMessage(
                'Please login first.',
                'error'
            );

            return;

        }


        /*
         * Load current central client
         */

        if(window.MDKClientContext){

            const activeClient =
                MDKClientContext.get();

            if(activeClient){

                await setActiveClient(
                    activeClient.id
                );

            }

        }


        /*
         * Check admin/super admin role
         */

        await loadClientsForAdmin(user);


        /*
         * Listen for central client changes
         */

        window.addEventListener(
            'mdk-client-changed',
            async function(event){

                const client =
                    event.detail;

                if(client && client.id){

                    await setActiveClient(
                        client.id
                    );

                }else{

                    clearClientUI();

                }

            }
        );


    }catch(error){

        console.error(
            'Initialization Error:',
            error
        );

        showMessage(
            error.message ||
            'Failed to initialize page.',
            'error'
        );

    }

}



/* =========================================================
   LOAD CLIENTS FOR ADMIN
========================================================= */

async function loadClientsForAdmin(user){

    try{

        /*
         * Existing platform role logic.
         * We first try inventory-style role table if present.
         */

        let role = null;


        const {
            data: roleData
        } =
            await supabaseClient
                .from('user_roles')
                .select('role')
                .eq('user_id', user.id)
                .maybeSingle();


        if(roleData){

            role =
                roleData.role;

        }


        /*
         * If role table is unavailable,
         * central client context can still work.
         */

        if(
            role === 'super_admin' ||
            role === 'admin'
        ){

            await loadAllClients();

            $('clientBox')
                .classList
                .remove('hidden');

            return;

        }


        /*
         * Normal client user
         */

        if(
            window.MDKClientContext
        ){

            const active =
                MDKClientContext.get();

            if(active){

                await setActiveClient(
                    active.id
                );

            }

        }

    }catch(error){

        console.warn(
            'Role detection:',
            error.message
        );

        /*
         * Do not block normal
         * central-client workflow.
         */

        if(
            window.MDKClientContext
        ){

            const active =
                MDKClientContext.get();

            if(active){

                await setActiveClient(
                    active.id
                );

            }

        }

    }

}



/* =========================================================
   LOAD ALL CLIENTS
========================================================= */

async function loadAllClients(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from('clients')
            .select(`
                id,
                company_name,
                slug,
                status
            `)
            .order(
                'company_name',
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            error
        );

        return;

    }


    clients =
        data || [];


    const select =
        $('clientSelect');


    select.innerHTML =
        '<option value="">-- Select Client --</option>';


    clients.forEach(
        function(client){

            const option =
                document.createElement(
                    'option'
                );

            option.value =
                client.id;

            option.textContent =
                client.company_name ||
                client.slug ||
                client.id;

            select.appendChild(
                option
            );

        }
    );


    /*
     * Select current context
     */

    if(currentClientId){

        select.value =
            currentClientId;

    }else if(
        window.MDKClientContext
    ){

        const active =
            MDKClientContext.get();

        if(active){

            select.value =
                active.id;

        }

    }

}



/* =========================================================
   CLIENT SELECT CHANGE
========================================================= */

async function handleClientChange(){

    const clientId =
        $('clientSelect').value;


    if(!clientId){

        clearClientUI();

        if(
            window.MDKClientContext
        ){

            MDKClientContext.clear();

        }

        return;

    }


    /*
     * Set central context.
     * Other modules will follow this.
     */

    const client =
        clients.find(
            c => c.id === clientId
        );


    if(
        client &&
        window.MDKClientContext
    ){

        MDKClientContext.set(
            client
        );

    }


    await setActiveClient(
        clientId
    );

}



/* =========================================================
   SET ACTIVE CLIENT
========================================================= */

async function setActiveClient(clientId){

    if(!clientId){

        clearClientUI();

        return;

    }


    currentClientId =
        clientId;


    const {
        data,
        error
    } =
        await supabaseClient
            .from('clients')
            .select(`
                id,
                company_name,
                slug,
                domain,
                hosting_type,
                hosting_url,
                template,
                status
            `)
            .eq(
                'id',
                clientId
            )
            .maybeSingle();


    if(error){

        console.error(
            'Client Load Error:',
            error
        );

        showMessage(
            error.message ||
            'Failed to load client.',
            'error'
        );

        return;

    }


    currentClient =
        data;


    if(
        window.MDKClientContext &&
        data
    ){

        /*
         * Keep central context
         * synchronized.
         */

        MDKClientContext.set(
            data
        );

    }


    updateActiveClientDisplay();

    resetForm();

    await loadSettings();

}



/* =========================================================
   ACTIVE CLIENT DISPLAY
========================================================= */

function updateActiveClientDisplay(){

    const box =
        $('currentClient');


    if(!currentClient){

        box.textContent =
            '';

        return;

    }


    box.textContent =
        'Active Client: ' +
        (
            currentClient.company_name ||
            currentClient.slug ||
            ''
        );



    if($('clientSelect')){

        $('clientSelect').value =
            currentClient.id;

    }

}



/* =========================================================
   CLEAR CLIENT UI
========================================================= */

function clearClientUI(){

    currentClientId =
        null;

    currentClient =
        null;

    currentSettings =
        null;


    $('currentClient')
        .textContent =
        '';


    if($('clientSelect')){

        $('clientSelect').value =
            '';

    }


    resetForm();

}



/* =========================================================
   LOAD COMPANY SETTINGS
========================================================= */

async function loadSettings(){

    if(!currentClientId){

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from('company_settings')
                .select(`
                    id,
                    client_id,
                    logo_url,
                    favicon_url,
                    tagline,
                    phone,
                    whatsapp,
                    email,
                    website,
                    address,
                    city,
                    state,
                    country,
                    postal_code,
                    about,
                    mission,
                    vision,
                    website_title,
                    meta_description,
                    facebook_url,
                    instagram_url,
                    linkedin_url,
                    youtube_url,
                    primary_color,
                    secondary_color,
                    created_at,
                    updated_at
                `)
                .eq(
                    'client_id',
                    currentClientId
                )
                .maybeSingle();


        if(error){

            throw error;

        }


        if(data){

            currentSettings =
                data;

            fillForm(
                data
            );

        }else{

            currentSettings =
                null;

        }


    }catch(error){

        console.error(
            'Company Settings Load Error:',
            error
        );


        showMessage(
            error.message ||
            'Failed to load company settings.',
            'error'
        );

    }

}



/* =========================================================
   FILL FORM
========================================================= */

function fillForm(data){

    $('logoUrl').value =
        data.logo_url || '';

    $('faviconUrl').value =
        data.favicon_url || '';

    $('tagline').value =
        data.tagline || '';

    $('phone').value =
        data.phone || '';

    $('whatsapp').value =
        data.whatsapp || '';

    $('email').value =
        data.email || '';

    $('website').value =
        data.website || '';

    $('address').value =
        data.address || '';

    $('city').value =
        data.city || '';

    $('state').value =
        data.state || '';

    $('country').value =
        data.country || '';

    $('postalCode').value =
        data.postal_code || '';

    $('about').value =
        data.about || '';

    $('mission').value =
        data.mission || '';

    $('vision').value =
        data.vision || '';

    $('websiteTitle').value =
        data.website_title || '';

    $('metaDescription').value =
        data.meta_description || '';

    $('facebookUrl').value =
        data.facebook_url || '';

    $('instagramUrl').value =
        data.instagram_url || '';

    $('linkedinUrl').value =
        data.linkedin_url || '';

    $('youtubeUrl').value =
        data.youtube_url || '';


    const primary =
        validColor(data.primary_color)
            ? data.primary_color
            : '#2563eb';


    const secondary =
        validColor(data.secondary_color)
            ? data.secondary_color
            : '#111827';


    $('primaryColor').value =
        primary;

    $('primaryColorText').value =
        primary;


    $('secondaryColor').value =
        secondary;

    $('secondaryColorText').value =
        secondary;

}



/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

    $('settingsForm').reset();


    $('primaryColor').value =
        '#2563eb';

    $('primaryColorText').value =
        '#2563eb';


    $('secondaryColor').value =
        '#111827';

    $('secondaryColorText').value =
        '#111827';


    currentSettings =
        null;

}



/* =========================================================
   COLOR SYNC
========================================================= */

$('primaryColor')
    .addEventListener(
        'input',
        function(){

            $('primaryColorText').value =
                this.value;

        }
    );


$('primaryColorText')
    .addEventListener(
        'input',
        function(){

            if(
                validColor(
                    this.value
                )
            ){

                $('primaryColor').value =
                    this.value;

            }

        }
    );


$('secondaryColor')
    .addEventListener(
        'input',
        function(){

            $('secondaryColorText').value =
                this.value;

        }
    );


$('secondaryColorText')
    .addEventListener(
        'input',
        function(){

            if(
                validColor(
                    this.value
                )
            ){

                $('secondaryColor').value =
                    this.value;

            }

        }
    );



/* =========================================================
   SAVE SETTINGS - SAFE UPSERT
========================================================= */

async function saveSettings(event){

    event.preventDefault();


    if(!currentClientId){

        showMessage(
            'Please select client first.',
            'error'
        );

        return;

    }


    const saveButton =
        $('saveBtn');


    saveButton.disabled =
        true;

    saveButton.textContent =
        'Saving...';



    /*
     * Build complete payload.
     */

    const payload = {

        client_id:
            currentClientId,


        logo_url:
            cleanValue(
                'logoUrl'
            ),


        favicon_url:
            cleanValue(
                'faviconUrl'
            ),


        tagline:
            cleanValue(
                'tagline'
            ),


        phone:
            cleanValue(
                'phone'
            ),


        whatsapp:
            cleanValue(
                'whatsapp'
            ),


        email:
            cleanValue(
                'email'
            ),


        website:
            cleanValue(
                'website'
            ),


        address:
            cleanValue(
                'address'
            ),


        city:
            cleanValue(
                'city'
            ),


        state:
            cleanValue(
                'state'
            ),


        country:
            cleanValue(
                'country'
            ),


        postal_code:
            cleanValue(
                'postalCode'
            ),


        about:
            cleanValue(
                'about'
            ),


        mission:
            cleanValue(
                'mission'
            ),


        vision:
            cleanValue(
                'vision'
            ),


        website_title:
            cleanValue(
                'websiteTitle'
            ),


        meta_description:
            cleanValue(
                'metaDescription'
            ),


        facebook_url:
            cleanValue(
                'facebookUrl'
            ),


        instagram_url:
            cleanValue(
                'instagramUrl'
            ),


        linkedin_url:
            cleanValue(
                'linkedinUrl'
            ),


        youtube_url:
            cleanValue(
                'youtubeUrl'
            ),


        primary_color:
            validColor(
                cleanValue(
                    'primaryColor'
                )
            )
            ?
            cleanValue(
                'primaryColor'
            )
            :
            '#2563eb',


        secondary_color:
            validColor(
                cleanValue(
                    'secondaryColor'
                )
            )
            ?
            cleanValue(
                'secondaryColor'
            )
            :
            '#111827',


        updated_at:
            new Date().toISOString()

    };



    try{

        /*
         * IMPORTANT:
         *
         * client_id has UNIQUE constraint:
         * company_settings_client_id_key
         *
         * Therefore upsert() is safer than
         * INSERT / UPDATE detection.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    'company_settings'
                )
                .upsert(
                    payload,
                    {
                        onConflict:
                            'client_id'
                    }
                )
                .select()
                .single();


        if(error){

            throw error;

        }


        currentSettings =
            data;


        /*
         * Refresh form with
         * database result.
         */

        fillForm(
            data
        );


        showMessage(
            'Company settings saved successfully.',
            'success'
        );


    }catch(error){

        console.error(
            'Company Settings Save Error:',
            error
        );


        showMessage(
            error.message ||
            'Failed to save company settings.',
            'error'
        );


    }finally{

        saveButton.disabled =
            false;

        saveButton.textContent =
            'Save Company Settings';

    }

}



/* =========================================================
   START
========================================================= */

initialize();

</script>

</body>

</html>
