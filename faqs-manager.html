<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ywvdozdoanmcxscfofcf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBALS
===================================================== */

let currentUser = null;

let currentRole = null;

let currentClientId = null;

let clients = [];

let faqs = [];

let editingId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const clientSelect =
document.getElementById(
    "clientSelect"
);


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

    try{

        /*
           Get logged-in user
        */

        const {
            data:{
                user
            },
            error:userError
        } =
        await supabaseClient
        .auth
        .getUser();


        if(userError)
            throw userError;


        if(!user){

            window.location.href =
                "admin.html";

            return;
        }


        currentUser =
            user;


        /*
           Get profile
        */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,role,client_id,full_name"
        )
        .eq(
            "id",
            user.id
        )
        .single();


        if(profileError)
            throw profileError;


        currentRole =
            profile.role;


        /*
           IMPORTANT:
           Always store profile client_id first.
        */

        currentClientId =
            profile.client_id ||
            null;


        /*
           SUPER ADMIN
        */

        if(
            currentRole ===
            "super_admin"
        ){

            document.getElementById(
                "clientBox"
            ).style.display =
                "block";


            await loadClients();


            /*
               Existing client assignment?
            */

            if(currentClientId){

                clientSelect.value =
                    currentClientId;


                showCurrentClient();


                await loadFAQs();

            }


            /*
               No client assignment?
               Select first client available.
            */

            else if(
                clients.length > 0
            ){

                currentClientId =
                    clients[0].id;


                clientSelect.value =
                    currentClientId;


                showCurrentClient();


                await loadFAQs();

            }


            else{

                resetFAQs(
                    "No clients found"
                );

            }

        }


        /*
           NORMAL USER
        */

        else{

            if(!currentClientId){

                showMessage(
                    "No client assigned to this user.",
                    "error"
                );


                resetFAQs(
                    "No client assigned"
                );


                return;
            }


            showCurrentClient();


            await loadFAQs();

        }

    }
    catch(error){

        console.error(
            "Initialization Error:",
            error
        );


        showMessage(
            error.message ||
            "Initialization failed.",
            "error"
        );


        resetFAQs(
            "Unable to initialize"
        );

    }

}


/* =====================================================
   LOAD CLIENTS
===================================================== */

async function loadClients(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("clients")
    .select(
        "id,company_name,domain,status"
    )
    .order(
        "company_name",
        {
            ascending:true
        }
    );


    if(error)
        throw error;


    clients =
        data || [];


    clientSelect.innerHTML =
    `
    <option value="">
        Select Client
    </option>
    `;


    clients.forEach(
        client => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
                client.id;


            option.textContent =
                client.company_name;


            clientSelect.appendChild(
                option
            );

        }
    );


    /*
       Keep assigned client selected
    */

    if(currentClientId){

        clientSelect.value =
            currentClientId;

    }


    clientSelect.onchange =
    async function(){

        const selected =
            this.value;


        currentClientId =
            selected ||
            null;


        faqs = [];


        editingId =
            null;


        if(currentClientId){

            showCurrentClient();


            await loadFAQs();

        }
        else{

            hideCurrentClient();


            resetFAQs(
                "Select a client"
            );

        }

    };

}


/* =====================================================
   CURRENT CLIENT DISPLAY
===================================================== */

function showCurrentClient(){

    const box =
        document.getElementById(
            "currentClientInfo"
        );


    if(!currentClientId){

        hideCurrentClient();

        return;
    }


    const client =
        clients.find(
            item =>
                item.id ===
                currentClientId
        );


    if(client){

        box.textContent =
            `Current Client: ${client.company_name}`;

    }
    else{

        box.textContent =
            `Current Client ID: ${currentClientId}`;

    }


    box.style.display =
        "block";

}


function hideCurrentClient(){

    document.getElementById(
        "currentClientInfo"
    ).style.display =
        "none";

}


/* =====================================================
   LOAD FAQS
===================================================== */

async function loadFAQs(){

    if(!currentClientId){

        resetFAQs(
            "Select a client"
        );

        return;
    }


    document.getElementById(
        "faqContainer"
    ).innerHTML =
    `
    <div class="loading">
        Loading FAQs...
    </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("faqs")
    .select("*")
    .eq(
        "client_id",
        currentClientId
    )
    .order(
        "sort_order",
        {
            ascending:true
        }
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Load FAQ Error:",
            error
        );


        document.getElementById(
            "faqContainer"
        ).innerHTML =
        `
        <div class="empty">

            <h3>
                Unable to load FAQs
            </h3>

            <p>
                ${escapeHtml(
                    error.message
                )}
            </p>

        </div>
        `;


        showMessage(
            error.message,
            "error"
        );


        updateStats();


        return;
    }


    faqs =
        data || [];


    renderFAQs();

}


/* =====================================================
   RESET FAQS
===================================================== */

function resetFAQs(
    title = "Select a client"
){

    document.getElementById(
        "faqContainer"
    ).innerHTML =
    `
    <div class="empty">

        <h3>
            ${escapeHtml(title)}
        </h3>

        <p>
            Select a client to view FAQs.
        </p>

    </div>
    `;


    document.getElementById(
        "totalCount"
    ).textContent =
        "0";


    document.getElementById(
        "activeCount"
    ).textContent =
        "0";


    document.getElementById(
        "inactiveCount"
    ).textContent =
        "0";

}


/* =====================================================
   RENDER
===================================================== */

function renderFAQs(){

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        faqs.filter(
            item => {

                const text =
                (
                    (item.question || "") +
                    " " +
                    (item.answer || "")
                )
                .toLowerCase();


                return (

                    (
                        !search ||
                        text.includes(
                            search
                        )
                    )

                    &&

                    (
                        !status ||
                        item.status ===
                        status
                    )

                );

            }
        );


    updateStats();


    const container =
        document.getElementById(
            "faqContainer"
        );


    if(!currentClientId){

        resetFAQs(
            "Select a client"
        );

        return;
    }


    if(filtered.length === 0){

        container.innerHTML =
        `
        <div class="empty">

            <h3>
                No FAQs found
            </h3>

            <p>
                Click "+ Add FAQ" to create your first FAQ.
            </p>

        </div>
        `;

        return;
    }


    container.innerHTML =
    `
    <div class="faq-list">

        ${
            filtered
            .map(
                item =>
                    createCard(item)
            )
            .join("")
        }

    </div>
    `;

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
    item
){

    const question =
        escapeHtml(
            item.question ||
            "Untitled Question"
        );


    const answer =
        escapeHtml(
            item.answer ||
            ""
        );


    const status =
        item.status ||
        "active";


    const statusClass =
        status === "active"
        ? "status-active"
        : "status-inactive";


    return `
    <div class="faq-card">

        <div class="faq-top">

            <div class="faq-question">
                ${question}
            </div>

            <span
                class="status ${statusClass}">

                ${escapeHtml(status)}

            </span>

        </div>


        <div class="faq-answer">
            ${answer}
        </div>


        <div class="faq-bottom">

            <div class="faq-meta">

                <span class="order">

                    Sort Order:
                    ${item.sort_order ?? 0}

                </span>

            </div>


            <div class="actions">

                <button
                    class="btn btn-edit"
                    onclick="editFAQ('${item.id}')">

                    Edit

                </button>


                <button
                    class="btn btn-danger"
                    onclick="deleteFAQ('${item.id}')">

                    Delete

                </button>

            </div>

        </div>

    </div>
    `;

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalCount"
    ).textContent =
        faqs.length;


    document.getElementById(
        "activeCount"
    ).textContent =
        faqs.filter(
            x =>
                x.status ===
                "active"
        ).length;


    document.getElementById(
        "inactiveCount"
    ).textContent =
        faqs.filter(
            x =>
                x.status ===
                "inactive"
        ).length;

}


/* =====================================================
   OPEN MODAL
===================================================== */

function openModal(
    id = null
){

    /*
       Safety check:
       If client not loaded yet, try to use profile client.
    */

    if(!currentClientId){

        showMessage(
            "Client is not loaded yet. Please refresh the page.",
            "error"
        );

        return;
    }


    editingId =
        id;


    document.getElementById(
        "faqModal"
    ).style.display =
        "flex";


    if(id){

        const item =
            faqs.find(
                x =>
                    x.id === id
            );


        if(!item){

            closeModal();

            return;
        }


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit FAQ";


        document.getElementById(
            "question"
        ).value =
            item.question ||
            "";


        document.getElementById(
            "answer"
        ).value =
            item.answer ||
            "";


        document.getElementById(
            "sortOrder"
        ).value =
            item.sort_order ??
            0;


        document.getElementById(
            "faqStatus"
        ).value =
            item.status ||
            "active";


        document.getElementById(
            "saveBtn"
        ).textContent =
            "Update FAQ";

    }
    else{

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add FAQ";


        clearForm();


        document.getElementById(
            "saveBtn"
        ).textContent =
            "Save FAQ";

    }

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "faqModal"
    ).style.display =
        "none";


    editingId =
        null;


    clearForm();


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Save FAQ";

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document.getElementById(
        "question"
    ).value =
        "";


    document.getElementById(
        "answer"
    ).value =
        "";


    document.getElementById(
        "sortOrder"
    ).value =
        0;


    document.getElementById(
        "faqStatus"
    ).value =
        "active";

}


/* =====================================================
   SAVE FAQ
===================================================== */

async function saveFAQ(){

    /*
       Final client verification
    */

    if(!currentClientId){

        showMessage(
            "No client selected.",
            "error"
        );

        return;
    }


    const question =
        document.getElementById(
            "question"
        )
        .value
        .trim();


    const answer =
        document.getElementById(
            "answer"
        )
        .value
        .trim();


    const sortOrder =
        parseInt(
            document.getElementById(
                "sortOrder"
            ).value
        ) || 0;


    const status =
        document.getElementById(
            "faqStatus"
        ).value;


    if(!question){

        showMessage(
            "Question is required.",
            "error"
        );

        return;
    }


    if(!answer){

        showMessage(
            "Answer is required.",
            "error"
        );

        return;
    }


    const payload = {

        client_id:
            currentClientId,

        question:
            question,

        answer:
            answer,

        sort_order:
            sortOrder,

        status:
            status

    };


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    const editing =
        Boolean(
            editingId
        );


    saveBtn.disabled =
        true;


    saveBtn.textContent =
        editing
        ? "Updating..."
        : "Saving...";


    try{

        if(editing){

            const {
                error
            } =
            await supabaseClient
            .from("faqs")
            .update(
                payload
            )
            .eq(
                "id",
                editingId
            )
            .eq(
                "client_id",
                currentClientId
            );


            if(error)
                throw error;


            showMessage(
                "FAQ updated successfully.",
                "success"
            );

        }
        else{

            const {
                error
            } =
            await supabaseClient
            .from("faqs")
            .insert(
                payload
            );


            if(error)
                throw error;


            showMessage(
                "FAQ added successfully.",
                "success"
            );

        }


        closeModal();

        await loadFAQs();

    }
    catch(error){

        console.error(
            "Save FAQ Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to save FAQ.",
            "error"
        );

    }
    finally{

        saveBtn.disabled =
            false;


        saveBtn.textContent =
            editing
            ? "Update FAQ"
            : "Save FAQ";

    }

}


/* =====================================================
   EDIT
===================================================== */

function editFAQ(id){

    openModal(id);

}


/* =====================================================
   DELETE
===================================================== */

async function deleteFAQ(id){

    if(!currentClientId){

        showMessage(
            "No client selected.",
            "error"
        );

        return;
    }


    const item =
        faqs.find(
            x =>
                x.id === id
        );


    if(!item)
        return;


    const confirmed =
        confirm(
            `Delete this FAQ?\n\n${item.question || ""}`
        );


    if(!confirmed)
        return;


    try{

        const {
            error
        } =
        await supabaseClient
        .from("faqs")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "client_id",
            currentClientId
        );


        if(error)
            throw error;


        showMessage(
            "FAQ deleted successfully.",
            "success"
        );


        await loadFAQs();

    }
    catch(error){

        console.error(
            "Delete FAQ Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to delete FAQ.",
            "error"
        );

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " +
        type;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3500
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
