<script>
/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://ywvdozdoanmcxscfofc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aAqO96BmDbYivhlgl_3z7g_1orXAscB";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   AUTH + DASHBOARD INITIALIZE
========================================= */

async function initialize(){

    try{

        /*
         * IMPORTANT:
         * Get current session.
         * Do NOT redirect automatically here.
         * This prevents admin <-> dashboard loop.
         */

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Session Error:",
                error
            );

            setText(
                "userName",
                "Session Error"
            );

            setText(
                "userRole",
                "Please login again"
            );

            return;
        }


        const session =
            data?.session;


        /*
         * NO SESSION
         */

        if(!session || !session.user){

            console.warn(
                "No active Supabase session."
            );

            setText(
                "userName",
                "Not Logged In"
            );

            setText(
                "userRole",
                "Please login from Admin Login"
            );

            setText(
                "clientName",
                "Login required"
            );

            setText(
                "clientDomain",
                ""
            );

            setText(
                "clientTemplate",
                ""
            );

            resetStats();

            return;
        }


        const user =
            session.user;


        /* =====================================
           LOAD PROFILE
        ===================================== */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id,role,client_id,full_name"
        )
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


        if(profileError){

            console.error(
                "Profile Error:",
                profileError
            );

            setText(
                "userName",
                user.email || "Admin"
            );

            setText(
                "userRole",
                "Profile Error"
            );

            resetStats();

            return;
        }


        if(!profile){

            setText(
                "userName",
                user.email || "Admin"
            );

            setText(
                "userRole",
                "Profile not found"
            );

            resetStats();

            return;
        }


        /* =====================================
           USER INFO
        ===================================== */

        setText(
            "userName",
            profile.full_name ||
            user.email ||
            "Admin"
        );

        setText(
            "userRole",
            profile.role ||
            "User"
        );


        /* =====================================
           SUPER ADMIN
        ===================================== */

        if(
            profile.role === "super_admin"
        ){

            const select =
                document.getElementById(
                    "globalClientSelect"
                );

            select.style.display =
                "block";


            await setupSuperAdminClients();

            return;
        }


        /* =====================================
           NORMAL CLIENT USER
        ===================================== */

        const select =
            document.getElementById(
                "globalClientSelect"
            );

        select.style.display =
            "none";


        if(!profile.client_id){

            showActiveClient(null);

            resetStats();

            return;
        }


        const client =
            await getClient(
                profile.client_id
            );


        if(!client){

            showActiveClient(null);

            resetStats();

            return;
        }


        saveClient(
            client
        );


        showActiveClient(
            client
        );


        await loadStats(
            client.id
        );


    }catch(error){

        console.error(
            "Dashboard Error:",
            error
        );

        setText(
            "userName",
            "Dashboard Error"
        );

        setText(
            "userRole",
            error.message ||
            "Unable to load dashboard"
        );

        resetStats();
    }
}


/* =========================================
   START
========================================= */

initialize();
</script>
