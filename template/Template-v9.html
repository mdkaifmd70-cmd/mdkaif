<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Professional service agency and consultant website template">

<title>NEXORA | Services & Consulting</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#4f46e5;
    --primary-dark:#3730a3;
    --secondary:#06b6d4;
    --accent:#f59e0b;

    --dark:#111827;
    --dark-2:#1f2937;
    --text:#374151;
    --muted:#6b7280;

    --light:#f8fafc;
    --light-blue:#eef2ff;
    --white:#ffffff;
    --border:#e5e7eb;

    --radius:18px;
    --shadow:0 18px 50px rgba(15,23,42,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",sans-serif;
    color:var(--text);
    background:#fff;
    line-height:1.7;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea,
select{
    font:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

.section{
    padding:90px 0;
}

.section-head{
    max-width:720px;
    margin:0 auto 50px;
    text-align:center;
}

.eyebrow{
    color:var(--primary);
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.section-head h2{
    font-family:"Manrope",sans-serif;
    color:var(--dark);
    font-size:42px;
    line-height:1.2;
    margin-bottom:15px;
}

.section-head p{
    color:var(--muted);
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:13px 22px;
    border-radius:10px;
    border:1px solid transparent;
    font-weight:800;
    cursor:pointer;
    transition:.25s ease;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-primary:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(79,70,229,.22);
}

.btn-outline{
    border-color:var(--border);
    color:var(--dark);
    background:#fff;
}

.btn-outline:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.btn-light{
    background:#fff;
    color:var(--primary);
}

.btn-light:hover{
    transform:translateY(-2px);
}

/* TOPBAR */

.topbar{
    background:var(--dark);
    color:#fff;
    font-size:13px;
}

.topbar-inner{
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.topbar-left,
.topbar-right{
    display:flex;
    gap:20px;
    align-items:center;
}

.topbar a{
    color:#fff;
    opacity:.9;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.97);
    border-bottom:1px solid var(--border);
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-mark{
    width:42px;
    height:42px;
    border-radius:11px;
    background:var(--primary);
    color:#fff;
    display:grid;
    place-items:center;
    font-family:"Manrope",sans-serif;
    font-size:20px;
    font-weight:800;
}

.logo-text strong{
    display:block;
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:20px;
    line-height:1;
}

.logo-text span{
    display:block;
    color:var(--muted);
    font-size:9px;
    letter-spacing:1.5px;
    margin-top:5px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:26px;
}

.nav-links a{
    color:var(--text);
    font-size:14px;
    font-weight:700;
}

.nav-links a:hover{
    color:var(--primary);
}

.menu-toggle{
    display:none;
    border:0;
    background:none;
    font-size:27px;
    cursor:pointer;
}

/* HERO */

.hero{
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 80% 20%,rgba(79,70,229,.16),transparent 30%),
        radial-gradient(circle at 15% 70%,rgba(6,182,212,.10),transparent 30%),
        var(--light);
}

.hero-grid{
    min-height:680px;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:70px;
}

.hero-content{
    padding:80px 0;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:999px;
    background:var(--light-blue);
    color:var(--primary);
    font-size:12px;
    font-weight:800;
    margin-bottom:18px;
}

.hero h1{
    font-family:"Manrope",sans-serif;
    color:var(--dark);
    font-size:clamp(43px,6vw,68px);
    line-height:1.06;
    letter-spacing:-2px;
    margin-bottom:22px;
}

.hero h1 span{
    color:var(--primary);
}

.hero p{
    max-width:620px;
    color:var(--muted);
    font-size:17px;
    margin-bottom:30px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.hero-trust{
    margin-top:30px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
}

.avatar-stack{
    display:flex;
}

.avatar-stack img{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--light);
    margin-left:-8px;
}

.avatar-stack img:first-child{
    margin-left:0;
}

.hero-trust-text strong{
    color:var(--dark);
    font-size:13px;
    display:block;
}

.hero-trust-text span{
    color:var(--muted);
    font-size:11px;
}

.hero-visual{
    position:relative;
}

.hero-image{
    height:520px;
    object-fit:cover;
    border-radius:25px;
    box-shadow:var(--shadow);
}

.hero-card{
    position:absolute;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:15px;
    padding:18px;
}

.hero-card.top{
    top:35px;
    left:-35px;
}

.hero-card.bottom{
    right:-30px;
    bottom:35px;
}

.hero-card strong{
    display:block;
    color:var(--dark);
    font-size:22px;
    font-weight:800;
}

.hero-card span{
    color:var(--muted);
    font-size:11px;
}

/* STATS */

.stats{
    background:var(--primary);
    color:#fff;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat{
    text-align:center;
    padding:24px;
    border-right:1px solid rgba(255,255,255,.16);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    font-family:"Manrope",sans-serif;
    font-size:34px;
}

.stat span{
    color:rgba(255,255,255,.75);
    font-size:13px;
}

/* ABOUT */

.about-grid{
    display:grid;
    grid-template-columns:.95fr 1.05fr;
    gap:70px;
    align-items:center;
}

.about-image-wrap{
    position:relative;
}

.about-image{
    height:510px;
    object-fit:cover;
    border-radius:20px;
}

.about-floating{
    position:absolute;
    bottom:25px;
    right:-25px;
    background:#fff;
    padding:22px;
    border-radius:15px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

.about-floating strong{
    display:block;
    color:var(--primary);
    font-size:30px;
    font-family:"Manrope",sans-serif;
}

.about-floating span{
    font-size:12px;
    color:var(--muted);
}

.about-content h2{
    font-family:"Manrope",sans-serif;
    color:var(--dark);
    font-size:43px;
    line-height:1.18;
    margin:10px 0 18px;
}

.about-content p{
    color:var(--muted);
    margin-bottom:16px;
}

.check-list{
    list-style:none;
    margin:25px 0;
}

.check-list li{
    margin:10px 0;
    font-weight:700;
    color:var(--dark-2);
}

.check-list li::before{
    content:"✓";
    color:var(--primary);
    font-weight:900;
    margin-right:10px;
}

/* SERVICES */

.services{
    background:var(--light);
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service-card{
    background:#fff;
    padding:28px;
    border:1px solid var(--border);
    border-radius:17px;
    transition:.25s;
}

.service-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow);
    border-color:#c7d2fe;
}

.service-icon{
    width:52px;
    height:52px;
    border-radius:13px;
    background:var(--light-blue);
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:24px;
    margin-bottom:20px;
}

.service-card h3{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:20px;
    margin-bottom:8px;
}

.service-card p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:18px;
}

.service-card a{
    color:var(--primary);
    font-weight:800;
    font-size:13px;
}

/* PROCESS */

.process-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.process-card{
    position:relative;
    padding:28px 22px;
    border:1px solid var(--border);
    border-radius:17px;
    background:#fff;
}

.process-number{
    width:43px;
    height:43px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:800;
    margin-bottom:20px;
}

.process-card h3{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:18px;
    margin-bottom:7px;
}

.process-card p{
    color:var(--muted);
    font-size:13px;
}

/* INDUSTRIES */

.industries{
    background:var(--dark);
    color:#fff;
}

.industries .section-head h2{
    color:#fff;
}

.industries .section-head p{
    color:#a7b0bf;
}

.industry-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.industry-card{
    padding:25px 20px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;
    background:rgba(255,255,255,.035);
    text-align:center;
    transition:.25s;
}

.industry-card:hover{
    background:rgba(255,255,255,.08);
    transform:translateY(-3px);
}

.industry-card .icon{
    font-size:29px;
    margin-bottom:10px;
}

.industry-card strong{
    display:block;
    font-size:15px;
}

.industry-card span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:4px;
}

/* PROJECTS */

.project-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.project-card{
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    background:#fff;
}

.project-image{
    height:230px;
    object-fit:cover;
}

.project-content{
    padding:22px;
}

.project-tag{
    color:var(--primary);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:800;
}

.project-content h3{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:19px;
    margin:6px 0;
}

.project-content p{
    color:var(--muted);
    font-size:13px;
}

/* TEAM */

.team{
    background:var(--light);
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.team-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
}

.team-image{
    height:270px;
    object-fit:cover;
}

.team-content{
    padding:18px;
    text-align:center;
}

.team-content strong{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:16px;
}

.team-content span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

/* TESTIMONIALS */

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.testimonial{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:27px;
}

.quote{
    color:var(--primary);
    font-size:34px;
    line-height:1;
    margin-bottom:12px;
}

.testimonial p{
    color:var(--text);
    font-size:14px;
    margin-bottom:22px;
}

.client{
    display:flex;
    align-items:center;
    gap:11px;
}

.client img{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
}

.client strong{
    display:block;
    color:var(--dark);
    font-size:13px;
}

.client span{
    display:block;
    color:var(--muted);
    font-size:11px;
}

/* FAQ */

.faq{
    background:var(--light);
}

.faq-list{
    max-width:850px;
    margin:auto;
}

.faq-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
}

.faq-question{
    width:100%;
    background:#fff;
    border:0;
    padding:20px;
    display:flex;
    justify-content:space-between;
    text-align:left;
    gap:20px;
    cursor:pointer;
    color:var(--dark);
    font-weight:800;
}

.faq-question span:last-child{
    color:var(--primary);
    font-size:20px;
}

.faq-answer{
    display:none;
    padding:0 20px 20px;
    color:var(--muted);
    font-size:14px;
}

.faq-item.open .faq-answer{
    display:block;
}

/* CTA */

.cta{
    background:
        linear-gradient(110deg,rgba(79,70,229,.97),rgba(67,56,202,.93)),
        url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    color:#fff;
}

.cta-inner{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.cta h2{
    font-family:"Manrope",sans-serif;
    font-size:45px;
    line-height:1.15;
    margin-bottom:15px;
}

.cta p{
    color:rgba(255,255,255,.8);
    margin-bottom:25px;
}

/* CONTACT */

.contact-grid{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:60px;
    align-items:start;
}

.contact-content h2{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:42px;
    line-height:1.2;
    margin:10px 0 15px;
}

.contact-content > p{
    color:var(--muted);
    margin-bottom:25px;
}

.contact-list{
    list-style:none;
}

.contact-list li{
    display:flex;
    gap:13px;
    margin:18px 0;
}

.contact-icon{
    width:42px;
    height:42px;
    flex:none;
    border-radius:10px;
    background:var(--light-blue);
    color:var(--primary);
    display:grid;
    place-items:center;
}

.contact-list strong{
    display:block;
    color:var(--dark);
    font-size:13px;
}

.contact-list span{
    color:var(--muted);
    font-size:12px;
}

.contact-form{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow);
}

.contact-form h3{
    color:var(--dark);
    font-family:"Manrope",sans-serif;
    font-size:25px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:12px;
    font-weight:800;
    color:var(--dark);
}

.form-group input,
.form-group textarea,
.form-group select{
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
    background:#fff;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--primary);
}

.form-submit{
    width:100%;
    margin-top:18px;
}

/* FOOTER */

.footer{
    background:#0b1120;
    color:#fff;
    padding:65px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr 1.1fr;
    gap:45px;
}

.footer h3{
    font-family:"Manrope",sans-serif;
    font-size:18px;
    margin-bottom:17px;
}

.footer p,
.footer li,
.footer a{
    color:#9ca3af;
    font-size:13px;
}

.footer ul{
    list-style:none;
}

.footer li{
    margin:9px 0;
}

.footer a:hover{
    color:#fff;
}

.socials{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.socials a{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border:1px solid #263044;
    border-radius:9px;
}

.newsletter{
    display:flex;
    margin-top:13px;
}

.newsletter input{
    min-width:0;
    flex:1;
    padding:11px;
    border:0;
    outline:0;
}

.newsletter button{
    border:0;
    padding:0 15px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-weight:800;
}

.footer-bottom{
    margin-top:45px;
    padding-top:20px;
    border-top:1px solid #1f2937;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:15px;
}

.footer-bottom p{
    font-size:11px;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:3000;
    background:var(--dark);
    color:#fff;
    padding:14px 18px;
    border-radius:10px;
    box-shadow:var(--shadow);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
    font-size:13px;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .hero-grid{
        gap:40px;
    }

    .hero-card.top{
        left:-10px;
    }

    .hero-card.bottom{
        right:-10px;
    }

    .service-grid{
        grid-template-columns:1fr 1fr;
    }

    .process-grid{
        grid-template-columns:1fr 1fr;
    }

    .industry-grid{
        grid-template-columns:1fr 1fr;
    }

    .team-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:800px){

    .topbar{
        display:none;
    }

    .nav-inner{
        min-height:68px;
    }

    .menu-toggle{
        display:block;
    }

    .nav-links{
        position:absolute;
        top:68px;
        left:4%;
        right:4%;
        background:#fff;
        border:1px solid var(--border);
        box-shadow:var(--shadow);
        border-radius:12px;
        display:none;
        flex-direction:column;
        align-items:flex-start;
        padding:20px;
        gap:15px;
    }

    .nav-links.show{
        display:flex;
    }

    .hero-grid,
    .about-grid,
    .contact-grid{
        grid-template-columns:1fr;
    }

    .hero-content{
        padding:65px 0 30px;
    }

    .hero-visual{
        padding-bottom:60px;
    }

    .hero-image{
        height:450px;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .stat:nth-child(2){
        border-right:0;
    }

    .stat{
        border-bottom:1px solid rgba(255,255,255,.16);
    }

    .project-grid,
    .testimonial-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    .section{
        padding:65px 0;
    }
