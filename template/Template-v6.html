<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Professional Doctor and Clinic Website Template">

<meta name="theme-color" content="#0f766e">

<title>CAREPLUS | Doctor & Clinic</title>

<style>

/* =========================================================
   V6 — DOCTOR / CLINIC TEMPLATE
   MD Kaif Web Platform
   ========================================================= */

:root{
    --primary:#0f766e;
    --primary-dark:#115e59;
    --secondary:#14b8a6;
    --dark:#0f172a;
    --text:#334155;
    --muted:#64748b;
    --white:#ffffff;
    --light:#f0fdfa;
    --light-2:#f8fafc;
    --border:#dbe5e7;
    --success:#16a34a;
    --danger:#dc2626;
    --radius:18px;
    --shadow:0 15px 45px rgba(15,23,42,.08);
    --shadow-lg:0 25px 70px rgba(15,23,42,.14);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color:var(--text);
    background:#fff;
    line-height:1.6;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea,
select{
    font:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

.section{
    padding:95px 0;
}

.section-sm{
    padding:65px 0;
}

.section-head{
    max-width:720px;
    margin:0 auto 52px;
    text-align:center;
}

.section-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--primary);
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.8px;
    margin-bottom:13px;
}

.section-tag::before{
    content:"";
    width:28px;
    height:2px;
    background:var(--secondary);
}

.section-title{
    color:var(--dark);
    font-size:clamp(31px,4vw,48px);
    line-height:1.12;
    letter-spacing:-1.5px;
    font-weight:850;
    margin-bottom:16px;
}

.section-description{
    color:var(--muted);
    font-size:15px;
}

.btn{
    min-height:48px;
    padding:0 21px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:.25s ease;
    font-size:13px;
    font-weight:800;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-primary:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}

.btn-light{
    background:#fff;
    color:var(--primary);
}

.btn-light:hover{
    transform:translateY(-2px);
}

.btn-outline{
    background:transparent;
    border-color:var(--primary);
    color:var(--primary);
}

.btn-outline:hover{
    background:var(--primary);
    color:#fff;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    background:var(--dark);
    color:#cbd5e1;
    font-size:12px;
    padding:9px 0;
}

.topbar-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.topbar-left,
.topbar-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.topbar a:hover{
    color:#fff;
}

/* =========================================================
   NAVBAR
   ========================================================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.nav-inner{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--dark);
    font-size:21px;
    font-weight:900;
}

.logo-mark{
    width:40px;
    height:40px;
    border-radius:11px;
    background:var(--primary);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:20px;
    font-weight:900;
}

.logo small{
    display:block;
    color:var(--primary);
    font-size:8px;
    letter-spacing:2px;
    margin-top:-3px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:26px;
}

.nav-links a{
    color:#475569;
    font-size:13px;
    font-weight:700;
}

.nav-links a:hover{
    color:var(--primary);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-btn{
    display:none;
    width:43px;
    height:43px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:10px;
    cursor:pointer;
    font-size:21px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    min-height:650px;
    background:
        linear-gradient(
            90deg,
            rgba(15,118,110,.97) 0%,
            rgba(15,118,110,.88) 48%,
            rgba(15,118,110,.38) 100%
        ),
        url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2000&q=85")
        center/cover;
}

.hero-inner{
    min-height:650px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:55px;
}

.hero-content{
    max-width:680px;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:#ccfbf1;
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:20px;
}

.hero-label span{
    width:30px;
    height:2px;
    background:#99f6e4;
}

.hero h1{
    color:#fff;
    font-size:clamp(42px,6vw,70px);
    line-height:1.03;
    letter-spacing:-3px;
    margin-bottom:22px;
    font-weight:900;
}

.hero h1 strong{
    color:#99f6e4;
}

.hero p{
    color:#dffcf8;
    font-size:16px;
    max-width:620px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.hero-card{
    width:min(390px,100%);
    justify-self:end;
    background:rgba(255,255,255,.13);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:22px;
    padding:30px;
    color:#fff;
}

.doctor-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    margin-bottom:18px;
    background:
        url("https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?auto=format&fit=crop&w=500&q=85")
        center/cover;
    border:4px solid rgba(255,255,255,.7);
}

.hero-card small{
    color:#99f6e4;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
}

.hero-card h3{
    font-size:25px;
    margin:5px 0 4px;
}

.hero-card p{
    font-size:12px;
    color:#d1fae5;
    margin:0 0 20px;
}

.hero-card-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.hero-mini{
    background:rgba(255,255,255,.09);
    border-radius:12px;
    padding:14px;
}

.hero-mini strong{
    display:block;
    font-size:22px;
}

.hero-mini span{
    color:#d1d5db;
    font-size:10px;
}

/* =========================================================
   QUICK INFO
   ========================================================= */

.quick-info{
    margin-top:-45px;
    position:relative;
    z-index:5;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
}

.quick-item{
    padding:27px 20px;
    text-align:center;
    border-right:1px solid var(--border);
}

.quick-item:last-child{
    border-right:0;
}

.quick-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#ccfbf1;
    color:var(--primary);
    display:grid;
    place-items:center;
    margin:0 auto 10px;
    font-size:19px;
}

.quick-item strong{
    display:block;
    color:var(--dark);
    font-size:14px;
    margin-bottom:3px;
}

.quick-item span{
    color:var(--muted);
    font-size:11px;
}

/* =========================================================
   ABOUT DOCTOR
   ========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:70px;
    align-items:center;
}

.about-visual{
    position:relative;
}

.about-image{
    min-height:510px;
    border-radius:25px;
    background:
        linear-gradient(0deg,rgba(15,23,42,.08),rgba(15,23,42,.08)),
        url("https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=1100&q=85")
        center/cover;
}

.about-badge{
    position:absolute;
    right:-22px;
    bottom:28px;
    width:190px;
    padding:23px;
    border-radius:18px;
    background:var(--primary);
    color:#fff;
    box-shadow:var(--shadow-lg);
}

.about-badge strong{
    display:block;
    font-size:30px;
    line-height:1;
    margin-bottom:5px;
}

.about-badge span{
    font-size:11px;
    color:#ccfbf1;
}

.about-content .section-title{
    text-align:left;
}

.about-content p{
    color:var(--muted);
    margin-bottom:16px;
    font-size:14px;
}

.about-list{
    list-style:none;
    display:grid;
    gap:11px;
    margin:24px 0 28px;
}

.about-list li{
    display:flex;
    gap:11px;
    align-items:center;
    font-size:13px;
    font-weight:750;
}

.check{
    width:22px;
    height:22px;
    flex:0 0 22px;
    border-radius:50%;
    background:#ccfbf1;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:11px;
    font-weight:900;
}

/* =========================================================
   SPECIALIZATIONS
   ========================================================= */

.specializations{
    background:var(--light);
}

.specialization-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.specialization{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:27px;
    transition:.25s;
}

.specialization:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow);
}

.specialization-icon{
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:#ecfdf5;
    color:var(--primary);
    font-size:22px;
    margin-bottom:18px;
}

.specialization h3{
    color:var(--dark);
    font-size:18px;
    margin-bottom:8px;
}

.specialization p{
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   SERVICES
   ========================================================= */

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service-card{
    padding:29px;
    border:1px solid var(--border);
    border-radius:18px;
    background:#fff;
    transition:.25s;
}

.service-card:hover{
    box-shadow:var(--shadow);
    transform:translateY(-4px);
}

.service-number{
    color:var(--primary);
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:21px;
}

.service-card h3{
    color:var(--dark);
    font-size:19px;
    margin-bottom:8px;
}

.service-card p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:18px;
}

.service-card a{
    color:var(--primary);
    font-size:12px;
    font-weight:850;
}

/* =========================================================
   TREATMENTS
   ========================================================= */

.treatments{
    background:var(--light);
}

.treatment-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.treatment{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:23px;
}

.treatment strong{
    display:block;
    color:var(--dark);
    font-size:15px;
    margin-bottom:6px;
}

.treatment span{
    color:var(--muted);
    font-size:11px;
}

/* =========================================================
   WHY CLINIC
   ========================================================= */

.why{
    background:var(--dark);
    color:#fff;
}

.why-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:65px;
    align-items:center;
}

.why .section-title{
    color:#fff;
    text-align:left;
}

.why-description{
    color:#94a3b8;
    margin-bottom:28px;
    font-size:14px;
}

.why-list{
    display:grid;
    gap:14px;
}

.why-item{
    display:flex;
    gap:14px;
    padding:16px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    border-radius:13px;
}

.why-icon{
    width:42px;
    height:42px;
    flex:0 0 42px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:rgba(20,184,166,.15);
    color:#5eead4;
}

.why-item h4{
    font-size:14px;
    margin-bottom:2px;
}

.why-item p{
    color:#94a3b8;
    font-size:11px;
}

.why-image{
    min-height:500px;
    border-radius:24px;
    background:
        linear-gradient(rgba(15,23,42,.08),rgba(15,23,42,.2)),
        url("https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&q=85")
        center/cover;
}

/* =========================================================
   FACILITIES
   ========================================================= */

.facility-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.facility{
    text-align:center;
    padding:25px 18px;
    border:1px solid var(--border);
    border-radius:16px;
}

.facility-icon{
    font-size:28px;
    color:var(--primary);
    margin-bottom:10px;
}

.facility h3{
    color:var(--dark);
    font-size:15px;
    margin-bottom:4px;
}

.facility p{
    color:var(--muted);
    font-size:11px;
}

/* =========================================================
   DOCTORS
   ========================================================= */

.doctor-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:21px;
}

.doctor-card{
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    background:#fff;
}

.doctor-photo{
    height:300px;
    background-position:center;
    background-size:cover;
}

.doctor-card:nth-child(1) .doctor-photo{
    background-image:url("https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?auto=format&fit=crop&w=800&q=85");
}

.doctor-card:nth-child(2) .doctor-photo{
    background-image:url("https://images.unsplash.com/photo-1594824476967-48c8b964273f?auto=format&fit=crop&w=800&q=85");
}

.doctor-card:nth-child(3) .doctor-photo{
    background-image:url("https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=800&q=85");
}

.doctor-info{
    padding:20px;
}

.doctor-info h3{
    color:var(--dark);
    font-size:18px;
}

.doctor-info span{
    color:var(--primary);
    font-size:11px;
    font-weight:850;
}

/* =========================================================
   GALLERY
   ========================================================= */

.gallery{
    background:var(--light);
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.gallery-item{
    height:215px;
    border-radius:14px;
    background-position:center;
    background-size:cover;
}

.gallery-item:nth-child(1){
    background-image:url("https://images.unsplash.com/photo-1519494080410-f9aa8f52f030?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(2){
    background-image:url("https://images.unsplash.com/photo-1538108149393-fbbd81895907?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(3){
    background-image:url("https://images.unsplash.com/photo-1587351021759-3e566b6af7cc?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(4){
    background-image:url("https://images.unsplash.com/photo-1516841273335-e39b37888115?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(5){
    background-image:url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(6){
    background-image:url("https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(7){
    background-image:url("https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=700&q=85");
}

.gallery-item:nth-child(8){
    background-image:url("https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&w=700&q=85");
}

/* =========================================================
   TESTIMONIALS
   ========================================================= */

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.testimonial{
    padding:29px;
    border:1px solid var(--border);
    border-radius:18px;
    background:#fff;
}

.quote{
    color:var(--secondary);
    font-size:35px;
    line-height:1;
    margin-bottom:17px;
}

.testimonial p{
    color:#475569;
    font-size:13px;
    margin-bottom:23px;
}

.testimonial-person{
    display:flex;
    align-items:center;
    gap:11px;
}

.person-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ccfbf1;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:900;
}

.person-info strong{
    display:block;
    color:var(--dark);
    font-size:12px;
}

.person-info span{
    color:var(--muted);
    font-size:10px;
}

/* =========================================================
   FAQ
   ========================================================= */

.faq{
    background:var(--light);
}

.faq-wrap{
    max-width:850px;
    margin:auto;
}

.faq-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
    margin-bottom:11px;
}

.faq-question{
    width:100%;
    border:0;
    background:#fff;
    color:var(--dark);
    padding:20px 21px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    text-align:left;
    font-weight:800;
    font-size:13px;
}

.faq-icon{
    width:28px;
    height:28px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#f1f5f9;
    color:var(--primary);
    transition:.25s;
}

.faq-answer{
    max-height:0;
    overflow:hidden;
    transition:.3s ease;
}

.faq-answer-inner{
    padding:0 21px 20px;
    color:var(--muted);
    font-size:12px;
}

.faq-item.active .faq-answer{
    max-height:180px;
}

.faq-item.active .faq-icon{
    transform:rotate(45deg);
    background:#ccfbf1;
}

/* =========================================================
   APPOINTMENT CTA
   ========================================================= */

.cta{
    padding:80px 0;
}

.cta-box{
    position:relative;
    overflow:hidden;
    border-radius:25px;
    padding:62px;
    background:
        linear-gradient(
            120deg,
            rgba(15,118,110,.97),
            rgba(15,118,110,.82)
        ),
        url("https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    color:#fff;
}

.cta-content{
    position:relative;
    z-index:2;
    max-width:670px;
}

.cta h2{
    font-size:clamp(32px,4vw,47px);
    line-height:1.1;
    margin-bottom:14px;
}

.cta p{
    color:#dffcf8;
    font-size:14px;
    margin-bottom:27px;
}

/* =========================================================
   CONTACT / APPOINTMENT
   ========================================================= */

.contact{
    background:var(--light);
}

.contact-grid{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:45px;
}

.contact-info h3{
    color:var(--dark);
    font-size:28px;
    line-height:1.2;
    margin-bottom:12px;
}

.contact-info>p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:28px;
}

.contact-list{
    display:grid;
    gap:15px;
}
