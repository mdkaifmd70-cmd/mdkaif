<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="SHOPORA - Modern retail and local business website template">

<title>SHOPORA | Retail & Local Business</title>

<style>

:root{
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --accent:#f59e0b;
    --dark:#111827;
    --dark-2:#1f2937;
    --text:#374151;
    --muted:#6b7280;
    --light:#f8fafc;
    --light-2:#f1f5f9;
    --white:#ffffff;
    --border:#e5e7eb;
    --success:#16a34a;

    --radius:16px;
    --shadow:0 12px 35px rgba(15,23,42,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:var(--white);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

button,
input,
textarea{
    font:inherit;
}

.container{
    width:min(1160px,92%);
    margin:auto;
}

.section{
    padding:90px 0;
}

.section-head{
    text-align:center;
    max-width:720px;
    margin:0 auto 48px;
}

.section-head span{
    display:inline-block;
    color:var(--primary);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-size:13px;
    margin-bottom:10px;
}

.section-head h2{
    color:var(--dark);
    font-size:40px;
    line-height:1.15;
    margin-bottom:14px;
}

.section-head p{
    color:var(--muted);
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 22px;
    border-radius:10px;
    border:2px solid transparent;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-primary:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}

.btn-light{
    background:#fff;
    color:var(--dark);
}

.btn-outline{
    border-color:var(--border);
    color:var(--dark);
    background:#fff;
}

.btn-outline:hover{
    border-color:var(--primary);
    color:var(--primary);
}

/* TOP BAR */

.topbar{
    background:var(--dark);
    color:#fff;
    font-size:13px;
}

.topbar-inner{
    min-height:42px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.topbar-left,
.topbar-right{
    display:flex;
    gap:20px;
    align-items:center;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:var(--dark);
    letter-spacing:-1px;
}

.logo span{
    color:var(--primary);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:27px;
    font-size:14px;
    font-weight:700;
}

.nav-links a{
    color:var(--dark-2);
}

.nav-links a:hover{
    color:var(--primary);
}

.menu-btn{
    display:none;
    border:0;
    background:var(--light-2);
    width:44px;
    height:44px;
    border-radius:10px;
    cursor:pointer;
    font-size:21px;
}

/* HERO */

.hero{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(120deg,rgba(17,24,39,.94),rgba(91,33,182,.84)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    color:#fff;
}

.hero-inner{
    min-height:650px;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:50px;
}

.hero-content{
    max-width:650px;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);
    padding:8px 14px;
    border-radius:50px;
    font-size:13px;
    font-weight:800;
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(44px,6vw,72px);
    line-height:1.02;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{
    color:#fbbf24;
}

.hero p{
    font-size:18px;
    color:rgba(255,255,255,.82);
    max-width:580px;
    margin-bottom:30px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.hero-card{
    background:#fff;
    color:var(--dark);
    border-radius:24px;
    padding:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.2);
}

.hero-card img{
    width:100%;
    height:340px;
    object-fit:cover;
    border-radius:17px;
}

.hero-card-bottom{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
    padding-top:18px;
}

.hero-card-bottom strong{
    display:block;
    font-size:20px;
}

.hero-card-bottom small{
    color:var(--muted);
}

/* QUICK INFO */

.quick-info{
    margin-top:-45px;
    position:relative;
    z-index:5;
}

.quick-grid{
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid var(--border);
    overflow:hidden;
}

.quick-item{
    padding:24px;
    display:flex;
    gap:14px;
    align-items:center;
    border-right:1px solid var(--border);
}

.quick-item:last-child{
    border-right:0;
}

.quick-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#ede9fe;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:20px;
    flex:none;
}

.quick-item strong{
    display:block;
    color:var(--dark);
}

.quick-item small{
    color:var(--muted);
}

/* CATEGORIES */

.category-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:16px;
}

.category-card{
    padding:25px 15px;
    text-align:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    transition:.25s;
}

.category-card:hover{
    transform:translateY(-5px);
    border-color:#c4b5fd;
    box-shadow:var(--shadow);
}

.category-icon{
    width:60px;
    height:60px;
    border-radius:50%;
    margin:0 auto 13px;
    display:grid;
    place-items:center;
    background:#f3e8ff;
    color:var(--primary);
    font-size:26px;
}

.category-card h3{
    font-size:15px;
    color:var(--dark);
}

/* PRODUCTS */

.products{
    background:var(--light);
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.product-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    transition:.25s;
}

.product-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
}

.product-image{
    height:245px;
    position:relative;
    overflow:hidden;
    background:var(--light-2);
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.product-card:hover .product-image img{
    transform:scale(1.05);
}

.product-tag{
    position:absolute;
    top:13px;
    left:13px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:900;
    padding:6px 9px;
    border-radius:7px;
}

.product-body{
    padding:19px;
}

.product-body small{
    color:var(--primary);
    font-weight:800;
}

.product-body h3{
    color:var(--dark);
    margin:5px 0 8px;
    font-size:18px;
}

.product-body p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:14px;
}

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.price{
    font-size:20px;
    font-weight:900;
    color:var(--dark);
}

.price del{
    font-size:12px;
    color:var(--muted);
    margin-left:5px;
}

.mini-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:0;
    background:#ede9fe;
    color:var(--primary);
    cursor:pointer;
    font-weight:900;
}

/* OFFER */

.offer{
    background:
        linear-gradient(100deg,rgba(91,33,182,.94),rgba(124,58,237,.86)),
        url("https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?auto=format&fit=crop&w=1800&q=80")
        center/cover;
    color:#fff;
}

.offer-inner{
    display:grid;
    grid-template-columns:1fr auto;
    gap:35px;
    align-items:center;
}

.offer h2{
    font-size:42px;
    line-height:1.1;
    margin-bottom:12px;
}

.offer p{
    color:rgba(255,255,255,.82);
    max-width:650px;
}

.offer-code{
    border:1px dashed rgba(255,255,255,.5);
    border-radius:14px;
    padding:20px 25px;
    text-align:center;
}

.offer-code small{
    display:block;
    opacity:.8;
}

.offer-code strong{
    font-size:28px;
    letter-spacing:2px;
}

/* ABOUT */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about-images{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.about-images img{
    height:245px;
    width:100%;
    object-fit:cover;
    border-radius:18px;
}

.about-images img:first-child{
    margin-top:35px;
}

.about-content span{
    color:var(--primary);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:900;
}

.about-content h2{
    font-size:42px;
    color:var(--dark);
    line-height:1.1;
    margin:10px 0 18px;
}

.about-content p{
    color:var(--muted);
    margin-bottom:16px;
}

.check-list{
    list-style:none;
    margin:22px 0;
}

.check-list li{
    margin:10px 0;
    font-weight:700;
    color:var(--dark-2);
}

.check-list li::before{
    content:"✓";
    color:var(--success);
    font-weight:900;
    margin-right:10px;
}

/* SERVICES */

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service-card{
    padding:28px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    transition:.25s;
}

.service-card:hover{
    border-color:#c4b5fd;
    box-shadow:var(--shadow);
    transform:translateY(-4px);
}

.service-icon{
    width:54px;
    height:54px;
    border-radius:14px;
    background:#ede9fe;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:23px;
    margin-bottom:18px;
}

.service-card h3{
    color:var(--dark);
    margin-bottom:8px;
}

.service-card p{
    color:var(--muted);
    font-size:14px;
}

/* WHY */

.why{
    background:var(--light);
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.why-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 22px;
}

.why-number{
    font-size:32px;
    font-weight:900;
    color:#ddd6fe;
}

.why-card h3{
    color:var(--dark);
    margin:8px 0;
}

.why-card p{
    color:var(--muted);
    font-size:14px;
}

/* GALLERY */

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:190px;
    gap:14px;
}

.gallery-item{
    overflow:hidden;
    border-radius:14px;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.gallery-item:hover img{
    transform:scale(1.07);
}

.gallery-item.large{
    grid-column:span 2;
    grid-row:span 2;
}

/* TESTIMONIALS */

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.testimonial{
    padding:28px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#fff;
}

.stars{
    color:#f59e0b;
    letter-spacing:3px;
    margin-bottom:15px;
}

.testimonial p{
    color:var(--muted);
    font-style:italic;
    margin-bottom:20px;
}

.customer{
    display:flex;
    align-items:center;
    gap:12px;
}

.customer-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ede9fe;
    display:grid;
    place-items:center;
    color:var(--primary);
    font-weight:900;
}

.customer strong{
    display:block;
    color:var(--dark);
}

.customer small{
    color:var(--muted);
}

/* FAQ */

.faq{
    background:var(--light);
}

.faq-list{
    max-width:850px;
    margin:auto;
}

.faq-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    margin-bottom:12px;
    overflow:hidden;
}

.faq-question{
    padding:20px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:15px;
    color:var(--dark);
    font-weight:800;
}

.faq-answer{
    display:none;
    padding:0 20px 20px;
    color:var(--muted);
    font-size:14px;
}

.faq-item.active .faq-answer{
    display:block;
}

.faq-plus{
    color:var(--primary);
    font-size:20px;
}

/* CONTACT */

.contact-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:35px;
}

.contact-box{
    background:var(--dark);
    color:#fff;
    border-radius:20px;
    padding:35px;
}

.contact-box h2{
    font-size:34px;
    margin-bottom:12px;
}

.contact-box>p{
    color:#cbd5e1;
    margin-bottom:25px;
}

.contact-item{
    display:flex;
    gap:13px;
    margin:18px 0;
}

.contact-item-icon{
    width:40px;
    height:40px;
    border-radius:10px;
    background:rgba(255,255,255,.1);
    display:grid;
    place-items:center;
    flex:none;
}

.contact-item strong{
    display:block;
}

.contact-item small{
    color:#cbd5e1;
}

.form-box{
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
}

.form-box h3{
    color:var(--dark);
    font-size:25px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:13px;
    font-weight:800;
    color:var(--dark-2);
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 13px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:120px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--primary);
}

/* CTA */

.cta{
    padding:75px 0;
    background:var(--primary);
    color:#fff;
    text-align:center;
}

.cta h2{
    font-size:43px;
    line-height:1.1;
    margin-bottom:13px;
}

.cta p{
    color:#ede9fe;
    max-width:650px;
    margin:0 auto 25px;
}

/* FOOTER */

footer{
    background:#0b1120;
    color:#fff;
    padding:65px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    gap:40px;
}

.footer-brand p{
    color:#94a3b8;
    margin-top:15px;
    max-width:340px;
}

.footer-col h4{
    margin-bottom:15px;
}

.footer-col a{
    display:block;
    color:#94a3b8;
    margin:9px 0;
    font-size:14px;
}

.footer-col a:hover{
    color:#fff;
}

.newsletter{
    display:flex;
    margin-top:18px;
    max-width:360px;
}

.newsletter input{
    flex:1;
    min-width:0;
    border:0;
    padding:12px;
    border-radius:9px 0 0 9px;
}

.newsletter button{
    border:0;
    padding:0 16px;
    background:var(--primary);
    color:#fff;
    font-weight:800;
    border-radius:0 9px 9px 0;
    cursor:pointer;
}

.footer-bottom{
    border-top:1px solid rgba(255,255,255,.1);
    margin-top:45px;
    padding-top:20px;
    display:flex;
    justify-content:space-between;
    gap:20px;
    color:#64748b;
    font-size:13px;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    background:var(--dark);
    color:#fff;
    padding:14px 18px;
    border-radius:10px;
    box-shadow:var(--shadow);
    transform:translateY(100px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .hero-inner,
    .about-grid,
    .contact-grid{
        grid-template-columns:1fr;
    }

    .hero-inner{
        padding:70px 0;
    }

    .hero-card{
        max-width:600px;
    }

    .category-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .why-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .footer-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .quick-item:nth-child(2){
        border-right:0;
    }

    .quick-item:nth-child(-n+2){
        border-bottom:1px solid var(--border);
    }
}

@media(max-width:760px){

    .section{
        padding:65px 0;
    }

    .section-head h2,
    .about-content h2{
        font-size:32px;
    }

    .topbar-left{
        display:none;
    }

    .topbar-inner{
        justify-content:center;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:76px;
        left:0;
        right:0;
        background:#fff;
        padding:20px;
        flex-direction:column;
        align-items:flex-start;
        border-bottom:1px solid var(--border);
        box-shadow:var(--shadow);
    }

    .nav-links.open{
        display:flex;
    }

    .menu-btn{
        display:block;
    }

    .nav-inner>.btn{
        display:none;
    }

    .hero h1{
        font-size:45px;
        letter-spacing:-2px;
    }

    .quick-grid,
    .category-grid,
    .product-grid,
    .service-grid,
    .why-grid,
    .testimonial-grid{
        grid-template-columns:1fr 1fr;
    }

    .offer-inner{
        grid-template-columns:1fr;
    }

    .gallery-grid{
        grid-template-columns:1fr 1fr;
        grid-auto-rows:150px;
    }

    .gallery-item.large{
        grid-column:span 2;
        grid-row:span 2;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .footer-bottom{
        flex-direction:column;
    }
}

@media(max-width:500px){

    .hero-inner{
        min-height:auto;
    }

    .quick-grid,
    .category-grid,
    .product-grid,
    .service-grid,
    .why-grid,
    .testimonial-grid{
        grid-template-columns:1fr;
    }

    .quick-item{
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .quick-item:last-child{
        border-bottom:0;
    }

    .hero-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .btn{
        width:100%;
    }

    .about-images{
        grid-template-columns:1fr;
    }
